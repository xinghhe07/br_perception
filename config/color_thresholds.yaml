# ═══════════════════════════════════════════════════════════════════════════════
# color_thresholds.yaml — 传统 CV HSV 颜色阈值
#
# 每个颜色可配置 1~N 组阈值，检测时取并集 (mask = group1 | group2 | ...).
# 只在确实需要多段覆盖时才加多组 (如红色跨 0°/180°).
# ⚠️  比赛现场必须重新校准！
# ═══════════════════════════════════════════════════════════════════════════════

# ── 红色队伍 (RGB: 223-34-34) ──
# Hue 跨越 0°/180° 边界，三组全覆盖红-粉-暗红
red_team:
  groups:
    - { lower: [0,   100, 50],  upper: [8,   255, 255] }   # 0°附近正红
    - { lower: [170, 100, 50],  upper: [180, 255, 255] }   # 180°附近正红
    - { lower: [0,   30,  50],  upper: [180, 99,  255] }   # 低饱和兜底 (暗红/粉)

# ── 蓝色队伍 (RGB: 50-0-255) ──
blue_team:
  groups:
    - { lower: [100, 80,  40],  upper: [130, 255, 255] }
    - { lower: [95,  40,  40],  upper: [135, 255, 255] }   # 暗光补偿

# ══════════════════════════════════════════════════════════════════════════════
# 穆斯蒂卡 —— ✅ 2026-09-20 按 v1.1 一手原文改正 (原 golden_mustika 作废)
#
# 官方 v1.1 第 10 页: "A Mikasa V300W volleyball (Size 5, circumference 65–67 cm)
# shall be used in its original condition ... Approximate weight: 260–280 grams"
#   → 实物是 **排球: 黄底 + 蓝纹 + 白字**, 不是金色球。
#   (中文 v1.0 译本写的"金色五人制足球 Ø200"是过时译本, 已废)
#
# 三色分工: 黄色是**主判据**(必须够量), 蓝纹/白字是**容忍色**(不否决黄底)。
# ⚠ 金属漆/赛场灯光都会让色相偏移, 现场必须用 hsv_tuner.py 对着实物重标!
# ══════════════════════════════════════════════════════════════════════════════

# ── 排球黄底 (主判据) ──
yellow_ball:
  groups:
    - { lower: [20,  60,  100], upper: [50,  255, 255] }
    - { lower: [18,  50,  80],  upper: [55,  255, 230] }   # 暗光补偿

# ── 排球蓝纹 (容忍色, 不否决黄底) ──
blue_mark:
  groups:
    - { lower: [90,  60,  40],  upper: [130, 255, 255] }
    - { lower: [85,  40,  35],  upper: [135, 255, 230] }   # 暗光补偿

# ── 排球白字 (容忍色, 不否决黄底) ──
white_mark:
  groups:
    - { lower: [0,   0,   200], upper: [180, 40,  255] }

# ── 球面判定参数 (文档 §1.4 v1.6 修订) ──
#   球坐在 Ø180 凹槽里 → 只有上半可见 → 圆形度不能卡太死
yellow_min_pixel_ratio: 0.50      # 球面候选黄底占比下限 (原金色 >60% 逻辑已废)
circularity_threshold: 0.70       # 圆形度下限 (原 0.85 太严, 凹槽遮挡下判掉真球)

# ── 深绿色穆斯蒂卡柱 (RGB: 40-100-50) ──
dark_green_pillar:
  groups:
    - { lower: [40,  60,  30],  upper: [80,  255, 180] }
    - { lower: [35,  40,  25],  upper: [85,  255, 150] }   # 暗光补偿

# ── 棕色核心支柱 (RGB: 100-62-0) ──
brown_core_pillar:
  groups:
    - { lower: [10,  60,  25],  upper: [28,  255, 180] }
    - { lower: [8,   40,  20],  upper: [30,  255, 150] }   # 暗光补偿

# ── 绿色建筑点位 (RGB: 40-100-50) ──
green_building_spot:
  groups:
    - { lower: [40,  60,  30],  upper: [80,  255, 180] }
    - { lower: [35,  40,  25],  upper: [85,  255, 150] }   # 暗光补偿

# ── 棕色围栏/边界 (RGB: 100-62-0) ──
brown_fence:
  groups:
    - { lower: [10,  60,  25],  upper: [28,  255, 200] }
    - { lower: [8,   40,  20],  upper: [30,  255, 160] }   # 暗光补偿

# ── 浅色区域 (地板、白线等) ──
light_colors:
  groups:
    - { lower: [0,   0,   150], upper: [180, 50,  255] }
    - { lower: [0,   0,   100], upper: [180, 70,  255] }   # 灰白扩展

# ── 后处理参数 ──
morphology_kernel_size: 3         # 形态学操作 (开/闭运算) 核大小
min_color_pixel_ratio: 0.7         # 判定颜色归属的最小像素占比
