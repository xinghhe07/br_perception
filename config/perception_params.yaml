# ═══════════════════════════════════════════════════════════════════════════════
# perception_pipeline 参数（任务书 §6.1 模块 27）
#
# 这个节点是**感知层与通信层之间那根断掉的线**：
#   `/perception/output` 是 comm_node 唯一的上行入口（comm_node.cpp:125 订阅它），
#   而在此之前**全仓库没有任何发布者** —— 下位机一帧都收不到。
#
# ⚠️⚠️ **本节点要加载两份 yaml**：
#       config/perception_params.yaml   ← 本文件
#       config/fusion_params.yaml       ← 见下
#     原因：本节点借 `CoordinateTransformer`（模块 17）做 TF 拿到 world 坐标，
#     而 `TransformerParams::load_from_node()` 会 declare 一批坐标系/里程计键
#     （`world_frame` / `lidar_frame` / `camera_wide_frame` / `robot_base_frame` /
#      `odometry.*` 等）—— **那些键的事实源是 fusion_params.yaml**，
#     两个节点必须逐字一致，否则雷达结果 TF 不过去，本节点一帧都发不出。
#     ⚠️ 别把那些键抄一份到这里 —— 抄了就有两个事实源，迟早漂移。
#     正确做法见 launch：把两份 yaml **都**传给本节点。
#
# ⚠️ 改本文件前先读 `src/core/include/br_perception/core/perception_pipeline.hpp`
#    的类文档 —— 那里写死了三条契约（坐标系硬约束 / 发布契约 / 字段策略），
#    本文件里的每个数都挂在其中某一条上。
# ═══════════════════════════════════════════════════════════════════════════════

perception_pipeline:
  ros__parameters:

    # ═══════════════════════════════════════════════════════════════════════════
    # 1. 话题
    # ═══════════════════════════════════════════════════════════════════════════
    # ⚠️ QoS 由代码写死、**不在这里配** —— 因为它是**兼容性约束**不是调参项：
    #    RELIABLE 订阅 ← BEST_EFFORT 发布 = **静默收不到**（不报错），反过来兼容。
    #    订阅端取的是各发布端**实际用的那一档**，改动前先去发布端确认。

    # 雷达结果（LidarResult）。发布端 lidar_perception_node 用 RELIABLE depth 10
    lidar_topic: "/perception/lidar/result"

    # 相机聚合帧（CameraFrame）。发布端 camera_perception 用 SensorDataQoS = BEST_EFFORT
    camera_topic: "/perception/camera/frame"

    # 通信诊断（DiagnosticArray）。本节点从 `communication/serial` 里取 `connected` 键。
    # ⚠️ 链路健康**只有 comm_node 知道**，本节点只是**观测**；
    #    "通信断开 → 缓存补发"是 comm_node 的活（它持有串口），不在这里做。
    comm_diag_topic: "/communication/diagnostics"

    # 输出：**通信层唯一的上行入口**。comm_node 按 BEST_EFFORT 订阅它，
    # 而本节点按 RELIABLE 发布 —— RELIABLE 发布对两种订阅者都兼容，是安全侧。
    output_topic: "/perception/output"

    # 紧急停止（std_msgs/Bool）。⚠️ 只在**状态变化**时发，仍处于紧急态则按
    # `emergency_repeat_sec` 重复（下游可能中途才连上）。
    # ⚠️⚠️ **现在还没落到线上**：全仓库对这条话题零订阅者，`protocol_encoder` 的
    #    `ERROR = 0x03` 至今是"未实现"。**不做这一步，它只是给 RViz 和日志看的** ——
    #    而 STM32 只会把"没收到感知帧"理解成"链路断了"，可那与"感知算不出坐标"
    #    的应对**正相反**（一个该等感知，一个该急停失能）。
    #    待办：comm_node 订阅本话题 → 编码 0x03，或塞进 0x02 心跳的 degraded 位。
    emergency_stop_topic: "/perception/emergency_stop"

    # 降级状态（DiagnosticArray，人看）。逐路列出 NEVER/OK/STALE/FAILED，
    # 外加 pose_available 与**按原因分开的**组帧失败计数。
    degradation_topic: "/system/degradation_state"

    # ═══════════════════════════════════════════════════════════════════════════
    # 2. 频率
    # ═══════════════════════════════════════════════════════════════════════════
    # ★ 契约（写在代码头文件里，改这个数之前先读）：
    #   **感知帧不参与底层控制闭环。** 它是**场景状态**（塔在哪、障碍在哪、
    #   还剩多久），不是控制反馈；BR 的底层闭环在主控自己的编码器/IMU 里。
    #
    #   为什么是 10 而不是更高 —— 不是"够用"，是**职责边界**：
    #   若真拿它做避障，按 BR 最高 0.5 m/s、允许 5cm 位置过时反推，
    #   预算 = 5cm ÷ 0.5 m/s = **100ms**，10Hz 刚好卡在线上；
    #   再加相机通路 ~43ms + 处理 + 串口，**立刻就超**。
    #   → 有人嫌慢时，正确做法是**别用它做闭环**，而不是把这个数调大。
    publish_rate_hz: 10.0

    # 降级状态发布频率（**不是每帧**）。它是给人看的，1Hz 足够。
    degradation_rate_hz: 1.0

    # ═══════════════════════════════════════════════════════════════════════════
    # 3. 各路"多久没来算旧"
    # ═══════════════════════════════════════════════════════════════════════════
    # ⚠️⚠️ **必须按该路自己的实际周期给，不能一律同一个值** ——
    #    雷达 10Hz（100ms 一帧）与通信心跳 1Hz（1s 一次）用同一个超时会**必然误报**。
    #    经验取值 ≈ **3~5 × 该路正常周期**，给抖动留余量。
    #    下限 0.05s（填 0 会让该路**一启动就是 STALE**，永远到不了 OK）。

    lidar_timeout_sec: 0.5        # 雷达 ~10Hz → 100ms 一帧，0.5s ≈ 5 帧
    camera_timeout_sec: 0.5       # 相机 ~30Hz → 更宽松也没关系，取齐雷达便于现场记
    fusion_timeout_sec: 2.0       # ⚠️ 融合层（模块 21）**尚未实现** → 恒 NEVER。
                                  #    这个值现在不起作用；留着是为了它落地时不必改代码。
    odom_timeout_sec: 0.5         # 里程计。⚠️ 本节点**只读** CoordinateTransformer 的结论，
                                  #    真正的超时判定在那边的 `odometry.timeout_sec`
                                  #    （fusion_params.yaml），这里不影响它
    comm_timeout_sec: 3.0         # ⚠️ 按 comm 诊断的发布周期给（`diagnostics_interval_sec`
                                  #    在 comm_params.yaml 里是 1.0s）→ 3s = 3 个周期。
                                  #    填 1.0 会因为周期抖动而间歇性误报 STALE

    # ═══════════════════════════════════════════════════════════════════════════
    # 4. 比赛计时（**近似**）
    # ═══════════════════════════════════════════════════════════════════════════
    # ⚠️ 契约：**以主控计时为准，感知只做 release 预警。**
    #    真正的比赛开始由裁判蜂鸣器决定，**感知无从得知** —— 本节点只能
    #    在"首次收到环境传感器数据"时起算，那个时刻通常比蜂鸣器晚。
    #    所以 `match_remaining_sec` 是**近似值**，不要拿它当主控的计时依据。
    match_duration_sec: 180.0     # 3 分钟（规则 §3.1.2）

    # ═══════════════════════════════════════════════════════════════════════════
    # 5. 告警阈值与事件补帧
    # ═══════════════════════════════════════════════════════════════════════════
    assembly_warn_ms: 5.0         # 组帧耗时超此值告警
                                  #   ⚠️ 只算**组帧本身**（拷小消息 + 逐点 TF），
                                  #      不含发布、不含检测。本节点不等待任何上游 ——
                                  #      它慢只有两种可能：消息体变大 / TF 变慢。

    # 端到端延迟告警阈值 [ms]。默认取 timer_utils 的 LatencyThresholds
    #   warn 56ms = §15.3 的 max(雷达 34, 视觉 46) + 10
    #   error 80ms = §7.3 的端到端超标线
    latency_warn_ms: 56.0
    latency_error_ms: 80.0

    # 紧急停止的**重复发布**间隔 [s]。0 = 只在状态变化时发一次。
    #   ⚠️ 不重发有风险：下游（comm_node）可能**中途才连上** —— 那正是
    #      最需要它知道当前处于紧急状态的时刻。
    emergency_repeat_sec: 2.0

    # ── 事件补帧（★ 性价比最高的一条）──
    # 场景显著变化时**立即补发一帧**，不等下一个 tick（反应延迟从 ≤100ms 掉到接近 0，
    # 平均带宽不变）。触发条件（见 perception_pipeline.cpp 的 scene_changed）：
    #   · 障碍物**个数**变化
    #   · 有障碍物**进入** `event_obstacle_near_m` 内、或近处位置又变了 > 0.2m
    #   · **建筑位状态翻转**（EMPTY ↔ 有塔）—— 比赛里最要紧的事件之一
    #   · **柱顶有无物体变化** —— 穆斯蒂卡"被取走 / 被放回"的信号
    #   · 降级模式翻转
    event_trigger_enabled: true

    # 事件补帧的**最小间隔** [s] —— 防抖动的硬闸。
    #   ⚠️ 它决定"最坏情况下帧率被悄悄提到多少"：0.05 ⇒ 上限 20Hz。
    #      调小之前先回头看上面的"感知帧不参与底层控制闭环"。
    #      下限 0.02s（填 0 会变成"每个输入回调都发"）。
    event_publish_min_interval_sec: 0.05

    # "近距"的定义 [m]。⚠️ 这个数**只用于判"要不要补帧"**，不是避障阈值 ——
    # 避障阈值是主控的事。取 2.0 是经验值：BR 0.5 m/s 下 2m ≈ 4 秒余量。
    event_obstacle_near_m: 2.0

# ═══════════════════════════════════════════════════════════════════════════════
# ⚠️ 下面这些**不在这里配**，理由各不同（别以为是漏了）
# ═══════════════════════════════════════════════════════════════════════════════
#
# · 坐标系名 / 里程计相关（`world_frame` / `lidar_frame` / `camera_wide_frame` /
#   `robot_base_frame` / `odometry.*`）
#     → 事实源是 **config/fusion_params.yaml**，本节点靠 `load_from_node()` 读它。
#       抄一份到这里 = 两个事实源，迟早漂移。
#
# · QoS
#     → 是**兼容性约束**不是调参项，写死在代码里（见上面第 1 节）。
#
# · 协议帧率 / 去重
#     → ✅ **已核实：不需要去重，这条待办作废**（2026-09-22）。
#       ⚠️ 原先这里写着"`send_rate_hz: 50` + 本节点 10Hz ⇒ 同一帧连发 5 次"——
#          **那是错的**。核实 `serial_manager.cpp:326-440`：队列空时发送线程超时返回、
#          **什么都不发**，不重发；`post_frame` 会 `notify_one` 立即唤醒。
#          `send_rate_hz` 只是兜底轮询周期 ⇒ **有效发送率 = 本节点发布率**。
#       ⚠️ 真正要盯的是**事件补帧把帧率抬高**：最坏 `1/event_publish_min_interval_sec`
#          （默认 20Hz）。按满载荷 280 B/帧 = 5.6 kB/s，460800 bps ≈ 46 kB/s，
#          余量充足；**改小那个间隔前先重算这条账**。
#
# · `PerceptionFrame` 里 `sanctuary_mandate_fulfilled` / `held_object_count`
#     → ⚠️ **本节点不提供**（诊断里明写 NOT PROVIDED BY PERCEPTION），
#       需**移出上行帧**：前者归融合层/主控维护，后者夹爪状态只有主控知道。
#       填 0 是**具体断言**不是"未知"：`sanctuary=0` 会让 TR 永远不去取穆斯蒂卡（白丢 250 分）。
#
# · `mustika_pose` 的有效性
#     → ⚠️ 协议要加 `mustika_pose_valid` 位，或写死契约"`mustika_state == 0` 时
#       主控必须忽略 `mustika_pose`"（当前靠后半条兜底）。理由同上：零值 PoseStamped
#       在协议里是一个**合法的世界坐标 (0,0,0) = 场地西南角**，不是"没填"。
