# ═══════════════════════════════════════════════════════════════════════════
# 相机参数配置 — ROBOCON 2027  (任务书 v1.7 §1.3)
# 硬件: JR H200S ×2（识别主力, 一宽一长焦, 勿组双目）+ Intel RealSense D435i ×1（近距深度）
#
# ⚠️ 2026-09-20 重构（原文件的结构是**读不到的**）:
#   旧版按 `camera_front:` / `camera_rear:` 分块, 但 4 个检测节点读的是
#   **自己节点名下的平铺参数** —— 两边的名字对不上, 结果整份配置**从来没被加载过**,
#   所有检测器一直跑代码里的硬编码默认值。
#   现在按**实际节点名**分块 (image_preprocessor / building_spot_detector /
#   mustika_detector / pillar_detector), 与各自的 declare_parameter 逐一对齐。
#
# 校验方式: 每个节点 declare_parameter 的名字都能在本文件里找到同名键。
# ═══════════════════════════════════════════════════════════════════════════

# ═════════════════════════════════════════════════════════════════════════════
# 1. 图像预处理 (image_preprocessor)
# ═════════════════════════════════════════════════════════════════════════════
image_preprocessor:
  ros__parameters:
    # 网络输入尺寸 (与训练/导出时一致)
    #   ⚠️ 640×384 是按"相机 1280×720 (16:9)"推的。**先量真实相机再定死** ——
    #      取 640 ÷ 宽高比 后向上对齐 32。见 doc/模型训练指南.md §1。
    model_input_w: 640
    model_input_h: 384
    # ROI 裁剪 [x, y, w, h]（像素）—— 只处理场地相关区域以降低计算量
    wide_roi: [0, 0, 1280, 720]
    # ⚠️ 2026-09-26 定稿: 这一行**真的是全图了** —— 因为裁切挪进了相机
    #   （`camera_hardware.yaml` 的 `camera_tele.roi = [172, 260, 1280, 720]`，
    #    由 `camera_bringup.launch.py` 喂给 `mvs_camera` 的 Offset/Width/Height）
    #   ⇒ 相机**输出就是** 1280×720 ⇒ 这里的 `[0,0,1280,720]` 命中 `crop_roi()` 的
    #   "全图短路"（`w >= image.cols` 成立），**不再裁**。
    #
    #   ⚠️ 在这之前它是**真的在裁**，而且裁的是**左上角**（`1280 >= 1624` 为假 ⇒
    #      短路不成立 ⇒ `cv::Rect(0,0,1280,720)`）—— 光轴跑到画幅右下、FOV 偏轴，
    #      而尺寸裁完恰好是 1280×720、与下游所有占位内参**全都对得上**
    #      ⇒ 整条链**自洽地错，不报任何错**。这就是"两个裁切点"曾经同时存在的那颗雷。
    #
    #   ⚠️ **仍然不要在这里加裁剪** —— 它会改主点（`cx/cy` 平移），而 `cx/cy` 的
    #      事实源在 `camera_hardware.yaml` 的标定结果里。要裁就裁在相机里（`roi`），
    #      让"相机输出"与"检测器看到的图"始终是**同一个参照系**。
    #   ⚠️ 配置与实机的对账：`scripts/calibrate_lidar_camera.py check` 的"尺寸链"。
    tele_roi:  [0, 0, 1624, 976]

    # ── 归一化 ──
    # ⚠️⚠️ **必须保持 false**（2026-09-21 实测踩过坑）
    #
    #   这条话题 `/perception/camera_wide/preprocessed` 是**一发布多订阅**：
    #   4 个检测器（mustika / pillar / building_spot）都在订阅它。
    #   **编码一变，所有订阅者都得跟着变** —— 而它们做的是传统 CV（HSV/轮廓），
    #   **必须吃 uint8**。
    #
    #   2026-09-20 曾把它打开成 true，想给 ONNX 喂 0–1 float32。后果：
    #     · 本节点输出 32FC3 (float32)
    #     · 检测器 `toCvShare(msg->image, BGR8)` **转不了 float32 → 抛异常**
    #     · 整条相机链路一帧都收不到（VM 实测）
    #
    #   **归一化是模型专属的事，不属于共享预处理。** 将来写 YOLO 检测器时，
    #   由**它自己**在推理前做 `convertTo(CV_32F, 1.0/255.0)`。
    #
    #   下面两个数组保留，只为万一要开时有个地方配 —— 开之前先想清楚订阅者。
    enable_normalize: false
    norm_mean: [0.0, 0.0, 0.0]
    norm_std:  [1.0, 1.0, 1.0]

    # ── 曝光补偿 (V 通道直方图拉伸) ──
    # ⚠️ 默认 false: Ultralytics 训练时不做这一步, 推理侧开着会造成训练/推理分布错配。
    #    要开的话, **训练数据也必须过同一套 compensate_exposure**, 否则不如不开。
    exposure_compensation_enabled: false

    # 宽角相机 CLAHE (对抗赛场光照突变; 见 v1.7 §3.1)
    # ⚠️ 同理: 开了就要在训练数据上也做, 否则是分布错配。
    wide_clahe_enabled: true
    wide_clahe_clip: 2.0
    wide_clahe_tile: 8
    # 长焦相机 CLAHE
    tele_clahe_enabled: true
    tele_clahe_clip: 2.0
    tele_clahe_tile: 8

# ═════════════════════════════════════════════════════════════════════════════
# 2. 建筑位检测 (building_spot_detector) — 绿色方格 HSV + 轮廓
# ═════════════════════════════════════════════════════════════════════════════
building_spot_detector:
  ros__parameters:
    color_yaml_path: "config/color_thresholds.yaml"
    morph_close_kernel: 5
    morph_close_iters: 1
    approx_epsilon_factor: 0.03      # 多边形近似的 epsilon 系数 (× 周长)
    contour_min_area: 200            # 轮廓面积下限 (px²)
    contour_max_area: 80000
    min_green_ratio: 0.70            # 框内绿色像素占比下限
    min_convexity: 0.88              # 凸度下限
    min_angle_score: 0.80            # 直角评分下限 (建筑位是方格)
    min_side_score: 0.70             # 边长一致性评分下限
    spot_real_size: 0.500            # 建筑位真实边长 (m) —— 规则 500×500
    focal_length_px: 600.0           # 近似焦距 (px); ⚠ 相机标定后回填
    min_distance: 0.3                # 有效检测距离 (m)
    max_distance: 5.0
    pnp_verify_enabled: false        # 是否用 PnP 复核位姿 (需相机内参)

# ═════════════════════════════════════════════════════════════════════════════
# 3. 穆斯蒂卡检测 (mustika_detector) — 排球: 黄底 + HoughCircles
#    ✅ 2026-09-20 按 v1.1 一手原文: 实物 = Mikasa V300W 排球 (黄底+蓝纹+白字 Ø≈210)
# ═════════════════════════════════════════════════════════════════════════════
mustika_detector:
  ros__parameters:
    color_yaml_path: "config/color_thresholds.yaml"
    morph_close_kernel: 5
    morph_close_iters: 2
    # ── HoughCircles ──
    hough_dp: 1.0
    hough_min_dist: 30.0             # 圆心最小间距 (px)
    hough_param1: 100.0              # Canny 高阈值
    hough_param2: 30.0               # 圆心累加器阈值
    hough_min_radius: 10
    hough_max_radius: 150
    # ── 球面验证 (v1.6 修订值: 球坐在 Ø180 凹槽里只有上半可见) ──
    min_golden_ratio: 0.50           # 圆内黄底占比下限 (原 0.60, 排球有蓝纹白字)
    min_circularity: 0.70            # 圆形度下限 (原 0.85, 凹槽遮挡下判掉真球)
    contour_min_area: 50
    contour_min_golden_ratio: 0.40   # fallback 轮廓路径的黄底占比放宽
    # ── 相机/距离 ──
    focal_length_px: 600.0           # ⚠ 相机标定后回填
    mustika_real_radius: 0.105       # 排球真实半径 (m) = Ø210/2 —— 决定 Hough 半径搜索窗
    min_distance: 0.2                # 有效检测距离 (m)
    max_distance: 3.0

# ═════════════════════════════════════════════════════════════════════════════
# 4. 柱子检测 (pillar_detector) — 深绿/棕色竖直矩形
# ═════════════════════════════════════════════════════════════════════════════
pillar_detector:
  ros__parameters:
    color_yaml_path: "config/color_thresholds.yaml"
    morph_close_kernel: 7
    morph_close_iters: 2
    min_aspect_ratio: 3.0            # 高/宽 比下限 (柱子是竖直长条)
    max_aspect_ratio: 12.0
    contour_min_area: 300
    contour_max_area: 60000
    min_color_fill: 0.55             # 框内目标色占比下限
    max_upright_angle: 15.0          # 允许的倾斜角 (°)
    top_check_offset: 0.10           # 柱顶检查区相对柱高的偏移 (归一化)
    top_object_threshold: 0.30       # 柱顶判定"有物体"的占比阈值
    # ── 真实尺寸 (m) —— 场地唯一事实源是 field_geometry.yaml, 这里供 PnP/测距 ──
    pillar_diameter: 0.270           # 两柱均 Ø270
    mustika_pillar_height: 0.500     # 地面柱 高 500
    core_pillar_height: 0.800        # L2 核心柱 高 800
    focal_length_px: 600.0           # ⚠ 相机标定后回填

# ═════════════════════════════════════════════════════════════════════════════════
# 4b. 天空方块「顶面颜色」判定 (sky_block_detector) —— 任务书 §3.3, 模块 9
#     规则 3.5.6: 天空方块按**顶面颜色**计分; 3.5.7 "颜色朝上的那队算完成这座塔
#     （**哪怕底下的地球块是对手的**）"; 3.5.8 对手可以**翻转**它偷塔。
#     ⇒ 40/80 分归属的唯一来源, 而雷达对颜色无能为力。
#
#     ⚠️⚠️ 本节点**只做判色, 不做检测**（检测要 YOLO26n ONNX, 那套基础设施仓库里
#        一样都没有）。得分场景的 ROI 应来自**雷达建筑位投影** —— **尚未实现**,
#        所以现在只能靠 `debug_roi_ratio` 手动指一个区域跑（台架调阈值用）。
# ═════════════════════════════════════════════════════════════════════════════════
sky_block_detector:
  ros__parameters:
    # ⚠️ 相对路径是**给 $PWD** 的, 而 launch 从任意目录起 ——
    #    launch **必须**用绝对路径覆盖它（见 bringup_full.launch.py 的 color_yaml）。
    color_yaml_path: "config/color_thresholds.yaml"

    # ── 判据（§3.3 原话: >70% 定色 / 45~55% 判"需靠近重新观察"）──
    decisive_ratio:  0.70   # 某一色占 (红+蓝) 超过它才定色
    # ⚠️⚠️ **别为了让仿真"跑出结果"去调这个数（2026-09-24 裁定）** ⚠️⚠️
    #   若判色链**恒报 `RATIO_AMBIGUOUS`（红蓝≈各半）**，先怀疑**被拍的那个东西**：
    #     · 仿真里 ⇒ **是场地模型错了**（天空方块应"下蓝上红"两个半高件，
    #       正放顶面**纯红**、倒放**纯蓝**）—— 见 `field_geometry.yaml`
    #       `sky_block_initial` 那段裁定 + `scripts/make_field_from_config.py`；
    #     · 实机上 ⇒ 要么看到的是**侧面/两个块**，要么是**掠射门控该拦没拦**
    #       （见 `min_face_h_px` / `max_grazing_deg`），要么相机内参/投影错位。
    #   ⇒ **放宽 `decisive_ratio` 的代价**：失败模式从"**判不出**"变成"**判反**"，
    #     而判反 = 把塔的归属**送给对手**（规则 3.5.6/3.5.7 的那 40/80 分）。
    #     "判不出"下游会靠近重看，"判反"没人能救回来。
    close_lo:        0.45   # "两色接近"区间下界
    close_hi:        0.55   # "两色接近"区间上界
    # ⚠️ 55%~70% 是**规格未定义段** —— 本模块取最保守读法: 只有 >70% 才定色,
    #    其余一律 UNKNOWN。理由: 判错的代价是把塔的归属**报反**。

    # ── 有效像素闸（**第一道**，先于颜色比例）──
    #    ⚠️ **规格没写, 本模块补的**。理由: "70% 的占比在只有几十个像素时毫无意义"
    #       —— 24 个红像素 / 900 也算 100% 红, 但它不该与 600/900 同等可信。
    #    ⚠️ 两个**同时**满足才算够。真值要拿实拍图重定（现在是保守估计）。
    min_valid_pixels: 80
    min_valid_ratio:  0.25

    # ── 几何 ──
    #    ⚠️ **只给"手动 ROI"那条兜底路用**（人工框的是整个方块 ⇒ 要按比例收成上半区域）。
    #    ✅ 判色主路（雷达建筑位投影）**不经过它** —— 投影直接给出顶面四角，
    #       再切一刀会把算准的顶面又切掉一半。见头文件 `top_face_roi` 的注释。
    #    ⚠️ 几何前提已于 2026-09-24 裁定（**顶面纯色**，原"红蓝各半"是误读），
    #       裁定与依据见 `field_geometry.yaml` 的 `sky_block_initial`。
    top_face_frac: 0.5

    # ═══════════════════════════════════════════════════════════════════════
    # 投影主路（雷达建筑位 → 图像 ROI）—— **2026-09-24 落地, 现在是主路**
    # ═══════════════════════════════════════════════════════════════════════
    # 得分场景是"已知建筑位上有一座塔": 位坐标是常量、位状态与平台高由雷达给,
    # 加上 TF 与内参 ⇒ "塔顶那块在哪"是**几何题**, 不需要检测网络。
    #
    # ⚠️⚠️ **本节点没有"自己去找方块"的能力**（只做判色）⇒ 要不要判**只能由雷达说**:
    #     只有 `BuildingSpot.state == 3 (完整塔)` 的位才会被投影。
    #     ⇒ 雷达没量出塔 ⇒ 本节点不发任何判色结论（这是对的, 不是故障）。
    #
    # ⚠️ `building_spot_x/y/z` 三个数组**不在本文件** —— 它们在
    #    `config/field_geometry.yaml` 的第 11 节兼容层（与 `lidar_perception_node`
    #    读的是**同一组键**）⇒ **launch 必须把那份 yaml 也传给本节点**，
    #    否则三个数组为空 ⇒ 投影主路直接关闭（构造时会 WARN 点名）。
    lidar_topic: "/perception/lidar/result"

    # ⚠️⚠️ **原 `world_frame: "world"` 已删（2026-09-25）—— 它是个死键。**
    #    本节点的 `.cpp` **既没有 declare 也没有读它**（`grep world_frame sky_block_detector.cpp` 为空）
    #    ⇒ 改它**不生效**，而注释写着"投影要能把位坐标从那个系转到相机系"，会让人以为改了有用。
    #    **它实际用的是 `spot_header.frame_id`** —— 也就是**雷达结果消息头里带的那个系**
    #    （`sky_block_detector.cpp` 的 TF 查询：`lookupTransform(camera_frames_[cam], spot_header.frame_id, …)`）。
    #    ⚠️ 这比读配置**更稳**：它跟随消息**实际声明的系**，而不是我们假设的。
    #    ⇒ 将来要给本节点加"世界系"参数时，**要连 `.cpp` 一起改**，别只往 yaml 里加键。
    tf_timeout_sec: 0.05    # ⚠️ 别用 tf2 默认的 0（同 mustika_pillar_check 的教训）

    # 两路相机在 **TF 树里**的 frame 名（下标 = camera_id）。
    # ⚠️ 必须与 `bringup_gazebo` 的 `SENSOR_TF` / `bringup_full` 广播的
    #    `--child-frame-id` **逐字一致** —— 对不上就查不到 TF, 而症状是**永远判不出来**。
    camera_frames: ["camera_wide_frame", "camera_tele_frame"]

    # ── 几何常量（**与 field_geometry.yaml 同源**, 改那边要同步这里）──
    tower_height_m: 0.90    # 完整塔高 = 地球 0.35×2 + 天空 0.20（±5% 公差 ⇒ 855~945mm）
    block_size_m:   0.20    # 天空方块边长（`sky_block.size`）

    # ── 内参（下标 = camera_id: 0=宽角 1=长焦）──
    # ⚠️⚠️ **这组是占位值**, 事实源在 `config/camera_hardware.yaml`, 标定后一起改。
    # ⚠️ **它们必须与「letterbox 之前那张图」的尺寸同源** —— 见下面的 orig_w/orig_h。
    fx: [800.0, 2380.0]
    fy: [800.0, 2380.0]
    cx: [640.0, 640.0]
    cy: [360.0, 360.0]
    # letterbox **之前**那张图的尺寸（= 相机的输出分辨率，或 ROI 裁剪后的尺寸）。
    # ⚠️⚠️ **2026-09-26: 这两个键在代码里是【死状态】—— 读进来就没再用过。**
    #    全仓库引用只有 `sky_block_detector.cpp:520,521,547,548,613,614`
    #    （declare / get / clamp），**没有任何投影或反变换消费它**。
    #    出界的兜底靠的是运行期求交（`sky_block_detector.cpp:129`
    #    的 `roi & cv::Rect(0, 0, bgr.cols, bgr.rows)`），不是靠这两个值。
    #
    # ⚠️ 更要命的是它**现在记的是错的**：两路尺寸已经不同了 ——
    #      · wide（JR，UVC）           = **1280×720**（它选定的 UVC 档位）
    #      · tele（海康，相机内裁居中）= **1624×976**（`camera_hardware.yaml` 的 `camera_tele.roi`）
    #    而本对是**单值**，且上面的 `fx/fy/cx/cy` 是**数组**（下标 0=wide / 1=tele）
    #    ⇒ 这一组**装不下现状**。
    #
    # ⇒ **故意不动**（2026-09-26 定：比赛为先，零得分收益 + 有回归风险）：
    #    ⚠️⚠️ **不能删** —— `launch/bringup_debug.launch.py:219-220` **真的在传它**
    #        （仿真的 `640/384`），删掉参数声明会让**那条 launch 起不来**。
    #        （早先一句"正解是删掉这两个键 + 那 6 行"是**错的**，已更正。）
    #    将来若要恢复它做尺寸校验：先**改成数组**（`orig_w: [1280, 1624]` /
    #    `orig_h: [720, 976]`）再接进投影，**别用现在的单值**，且要同步改
    #    `bringup_debug` 的 `SIM_INTRINSICS`。
    #    ⚠️ 别在这两个键上"顺手改成 tele 的值" —— 那会把 wide 弄错，而它照样不报错。
    orig_w: 1280
    orig_h: 720

    # ── 掠射门控（**能不能判**的硬闸, 见头文件 `project_spot` 那段）──
    #    顶面投影高度低于 min_face_h_px、或相机落在顶面下方(max_grazing_deg) ⇒
    #    直接报 `GRAZING_ANGLE`（动作: 换位姿/靠近）, **不去判一个必错的颜色**。
    #    ⚠️ 6px 是**经验线**（再少就被单行噪声支配）, 不是推导出来的 —— 相机到手后重定。
    min_face_h_px:   6.0
    max_grazing_deg: 89.0

    # ⚠️ **手动 ROI（只剩兜底的过渡手段）**：相对宽高的 `[x, y, w, h]`（0~1）。
    #    ✅ 投影主路（上面那段）落地后**它在比赛模式应该留空**；
    #    台架调阈值时才用它指一个区域（那时投影主路没产出, 它才生效）。
    #
    # ⚠️⚠️ **原 `debug_roi_ratio: []` 已删（2026-09-25）—— 它让整个 launch 起不来。**
    #    ROS 2 的**空数组**会被解析成"**无值参数**"：`launch_ros` 的
    #    `evaluate_parameter_dict` 把它归一化成 tuple `()`，随后
    #    `ensure_argument_type` 只认 float/int/str/bool/bytes ⇒ 抛
    #    `TypeError: Expected 'value' ... but got '()' of type 'tuple'`
    #    ⇒ **`bringup_debug.launch.py` 在加载 sky_block_detector 时整份失败**（不是这一个参数失效）。
    #    ⚠️ 同一个坑 2026-09-12 已在 `config/field_geometry.yaml:150` 踩过一次
    #       （`l1: [] / l2: []`），**当时只修了那一个文件**，这处漏了下来。
    #    节点侧 `debug_roi_ratio_` 的**默认值本来就是空 `{}`** ⇒ 删掉这一行**行为完全不变**，
    #    台架要用手动 ROI 时再加（**别加空表**，加 `[x, y, w, h]` 四个数）。
    roi_min_area: 64        # ROI 像素面积下限, 再小判色无意义（噪声主导）

    # ── 时序确认（规则 3.5.8: 对手会来翻, 一帧抖动不能翻归属）──
    enter_confirm_frames: 2   # 连续多少帧判出颜色才 CONFIRMED
    exit_confirm_frames:  3   # 连续多少帧判不出才掉出（之间是 COASTING 滞回窗口）
    # ⚠️ exit 会被抬到 ≥ enter —— 反了的话"刚确认就掉出", 滞回形同虚设。

# ═════════════════════════════════════════════════════════════════════════════════
# 5. D435i 深度辅助 (camera_depth) —— 任务书 §3.0 三相机并行
#    只出深度, 不跑 YOLO。给一个目标 ROI → 回该处的鲁棒深度。
#    ⚠️ 本节点**不依赖任何外参标定**(只输出相机系下的量);
#       也**不读 color_thresholds.yaml**(它不做颜色)。
# ═════════════════════════════════════════════════════════════════════════════════
camera_depth:
  ros__parameters:
    # ── 话题 ──
    depth_topic: "/camera/depth/image_rect_raw"   # realsense2_camera 的默认深度话题
    roi_topic:   "/camera/depth/target_roi"       # 上层给的目标 ROI (sensor_msgs/RegionOfInterest)
                                                  #   ⚠️ 这是进 MEASURE 模式的**唯一入口**;
                                                  #      谁有 TF + 跨相机外参谁去算 ROI

    # ── 深度解码 ──
    depth_scale_m: 0.001          # 16UC1 的换算 (默认 mm → m); 32FC1 不用这个值

    # ── 有效深度范围与健康判据 ──
    depth_min_m: 0.10             # 近于此视为无效 (噪声)
    depth_max_m: 10.0             # 远于此视为无效 (D435i 量程上界)
    valid_ratio_min: 0.10         # 有效像素占比低于此 → valid=false

    # ── 「最近的显著深度簇」的判据 ──
    hist_bin_m: 0.05              # 深度直方图 bin 宽 (m)
    min_cluster_px: 30            # 成簇最小像素数 —— ⚠️ 挡飞点/反光靠这个:
                                  #   单个飞点凑不满 → 被跳过

    # ── 模式与节流 ──
    roi_timeout_sec: 0.5          # 多久没收到新 ROI 就退回 IDLE
    diag_rate_hz: 1.0             # 诊断发布频率 (不是每帧)
    stream_timeout_sec: 1.0       # 多久没帧判"深度流断了"并报 ERROR 诊断
                                  #   ⚠️ 会被下限抬到 >= 1/diag_rate_hz

# ═════════════════════════════════════════════════════════════════════════════════
# 6. 相机层聚合薄壳 (camera_perception) —— 任务书 §15.1 模块 10, P0-2
#    把上面 3 个检测器 × 两路相机 + 深度，聚合成"某一时刻的那一帧"。
#    **不做检测、不变换坐标、不碰外参** —— 只做时间对齐 + 打包。
#
#    ⚠️ 三个检测输入参数是**前缀**（名字里就带 `_prefix`），节点会自动拼
#       `_wide` / `_tele` —— 与三个检测器的发布名逐字符对应
#       (mustika_wide / mustika_tele / …)。改名前先看那边。
#       ⚠️ 填成带后缀的全名会得到 `..._wide_wide`，**静默收不到任何数据**（不报错）。
# ═════════════════════════════════════════════════════════════════════════════════
camera_perception:
  ros__parameters:
    # ── 输入话题**前缀**（节点自动加 _wide / _tele 后缀）──
    mustika_topic_prefix: "/perception/camera/mustika"
    pillar_topic_prefix:  "/perception/camera/pillars"
    spot_topic_prefix:    "/perception/camera/building_spots"
    depth_topic:          "/perception/camera/depth"   # 这一路**不加后缀**（只有一路）

    # ── 输出话题 ──
    frame_topic:   "/perception/camera/frame"
    diag_topic:    "/perception/camera/frame_diagnostics"

    # ── 组帧节流 ──
    frame_rate_hz: 30.0           # 组帧频率 —— ⚠️ 与检测器耗时**无关**:
                                  #   慢的那路只会让它的 stale_sec 变大, 不拖慢整帧
    diag_rate_hz:  1.0            # 诊断发布频率 (不是每帧)

    # ── 告警阈值 ──
    assembly_warn_ms: 5.0         # 组帧耗时超此值告警 [ms]
                                  #   ⚠️ 这只是**组帧本身**的开销 (拷 6~7 条小消息),
                                  #      不含检测耗时、也不含发布本身。
                                  #      本节点不等待任何检测器 ——
                                  #      所以它慢只有一种可能: 消息体变大了。
                                  #   ⚠️ 用单调时钟量, 仿真里 ROS 时间暂停不会误报。

    future_tolerance_sec: 0.05    # 时间戳"未来"多少秒以内算正常 [s]
                                  #   超出 → 报 WARN (时钟跳变/驱动异常), 且该值
                                  #   如实写进 slot_status[].stale_sec (负值),
                                  #   **不钳到 0** —— 异常本身就是要暴露的东西

    fresh_tolerance_sec: 0.5      # ⭐ FRESH / STALE 的分界 [s]
                                  #   stale_sec 超过它就报 STALE。**这条是必需的**:
                                  #   曝光时刻永远早于组帧时刻 → stale_sec 恒为正数,
                                  #   若拿 ">0" 当界, state 永远到不了 FRESH。
                                  #   调参要同时满足两件相反的事:
                                  #     · 比"检测器**正常**周期"大 (处理 20~40ms 的健康路
                                  #       不该闪 STALE) —— 这也是它按"秒"给而不是按帧给的原因
                                  #     · 比"真停了"短 (停掉的路要半秒内变成 STALE)
                                  #   默认 0.5s ≈ 30Hz 下 15 帧没更新才算旧。
                                  #   ⚠️ 填 0 会被下限抬到 0.01s, 那会让每个槽都恒报 STALE

# ═══════════════════════════════════════════════════════════════════════════════
# 相机硬件规格（内外参 / 分辨率 / 曝光）已拆到 **config/camera_hardware.yaml**
#   —— 那些不是 ROS 节点参数, 留在这里会让整份文件加载失败 (2026-09-21)
# ═══════════════════════════════════════════════════════════════════════════════
