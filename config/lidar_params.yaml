# ═══════════════════════════════════════════════════════════════════════════
# 雷达感知管线参数 — ROBOCON 2027
# 使用方式: ros2 launch br_perception lidar_perception.launch.py
# ═══════════════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ── 预处理 ──
    leaf_size: 0.05                    # 体素降采样尺寸 (m)
    enable_outlier_filter: true
    outlier_mean_k: 10
    outlier_std_thresh: 1.0
    # ── 坐标系（2026-09-24 新增）──
    #   ⚠️⚠️ 本节点的**每个常量都是场地系的值**（l0/l1/l2_height、roi、building_spot_*），
    #      而输入点云是雷达系（`livox_frame`）⇒ 进回调先整份搬到本键指定的系里。
    #   ⚠️ 名字必须与融合层 `fusion_params.yaml` 的 `world_frame` 一致;
    #      没人广播它时（`perception_pipeline` 没起）本节点**全帧报 UNKNOWN**, 且不报错。
    #   ⚠️ 置空串 = 明确"不换系"（只在"输入点云本来就在场地系"时才对）。
    #   ⚠️⚠️ **本键在两份 `/**` 通配文件里同名**（这里 + `fusion_params.yaml`）——
    #       `check_param_consumers.py` 会把它报成 B1（它**没报错**，这是真形状）。**不改作用域**:
    #       本文件整份都是 `/**`, 而容器化重构会改节点名 ⇒ 挪进节点作用域块会**静默失效**。
    #       ⇒ 唯一的纪律: **别把这两份同时传给同一个节点**（今天没有一条 launch 这么做,
    #         所以它现在咬不到人）。真这么传 = 谁生效取决于 `parameters=` 里的先后顺序。
    world_frame: "world"
    tf_timeout_sec: 0.05               # ⚠️ 别用 tf2 默认的 0（同 mustika_pillar_check 的教训）

    roi_min_x: -10.0                   # ROI 裁剪范围
    roi_max_x: 30.0
    roi_min_y: -10.0
    roi_max_y: 10.0
    roi_min_z: -0.5
    roi_max_z: 2.0

    # ── 地面分割 ──
    ransac_distance_threshold: 0.04           # RANSAC 距离阈值 (m)
    ransac_max_iterations: 100
    ransac_eps_angle: 0.45             # 法向量约束角 (rad)
    enable_normal_constraint: true
    normal_angle_threshold: 0.15       # 验证阈值 (rad)
    l0_height: 0.0                     # 平台高度 L0/L1/L2 (m)
    l1_height: 0.6
    l2_height: 0.9
    layer_tolerance: 0.15              # 分层容差 (m)

    # ── 圆柱检测 ──
    normal_k_search: 20                # 法向量 K 近邻
    slice_thickness: 0.03              # 切片厚度 (m)
    slice_min_points: 8
    circle_fit_thresh: 0.02            # 2D 圆拟合距离阈值 (m)
    radius_min: 0.08                   # 圆柱半径范围 (m)
    radius_max: 0.20
    merge_center_tol: 0.05             # 合并同心切片容差 (m)
    merge_radius_tol: 0.03             # 合并半径容差 (m)
    merge_min_slices: 3
    min_cyl_height: 0.10               # 最小圆柱高度 (m)
    cyl3d_dist_thresh: 0.025           # RANSAC 3D 距离阈值 (m)
    cyl3d_max_iters: 200
    cyl3d_normal_weight: 0.1
    cyl3d_axis_eps: 0.35
    mustika_h_min: 0.40                # Mustika 柱高度范围 (m)
    mustika_h_max: 0.60
    core_h_min: 0.70                   # Core 柱高度范围 (m)
    core_h_max: 0.90

    # ── 障碍物聚类 ──
    cluster_tolerance: 0.05            # 欧式聚类距离阈值 (m)
    min_cluster_size: 5
    max_cluster_size: 5000
    max_object_size: 2.0               # 过滤: 最大尺寸 (m)
    max_object_height: 2.0             # 过滤: 最大高度 (m)
    min_object_points: 5               # 过滤: 最小点数
    floating_z_min: 0.8                # 过滤: 悬空物底部 Z (m)
    size_tolerance: 0.08               # 分类尺寸容差 (m)
    earth_cube_size: 0.35              # 地球方块尺寸 (m)
    sky_cube_size: 0.20                # 天空方块尺寸 (m)
    enemy_robot_size: 0.70             # 敌方机器人尺寸 (m)
    mustika_size: 0.20                 # 穆斯蒂卡尺寸 (m)
    elongation_ratio: 2.0
    sphere_eigen_tol: 0.3

    # ── 建筑位分析 ──
    # ⚠️ `platform_z` **已移走**（2026-09-23），别再往这里加回来：
    #    它是**场地事实**（L1 平台面 = 0.6m），归 `config/field_geometry.yaml`。
    #    这里原先写的 `0.0` 是错的 —— 把**地面**当成了平台面（注释"平台表面 Z"本身就没对上）。
    #    而且两份文件都是 `/**` 通配、都会被 launch 传给同一个节点 ⇒
    #    谁生效只看 launch 的 parameters 顺序。删掉这份副本是根治。
    # ⚠️ 但**下面这些判定阈值留在本文件**，这是有意的：
    #    它们随"**我们怎么判**"变（裁剪窗口 / 容差 / 判定带宽），不随场地实测变。
    #    物理量在 field_geometry，判定带宽在算法 —— 这条线要守住。
    spot_half_size: 0.25               # ⚠️ 这是**裁剪半宽**(算法窗口)，不是场地尺寸。
                                       #    场地真值见 field_geometry 的 building_spots.spot_size (0.5)。
                                       #    ⚠️ 将来若要放宽裁剪，**新增语义明确的
                                       #    `spot_crop_half_size`**，别复用这个键改语义。
    column_z_min: 0.0                  # 柱状区 Z 下界偏移 (m)
    column_z_max: 1.5                  # 柱状区 Z 上界偏移 (m)
    min_points_threshold: 5             # 最小点数阈值 (独立组件用)
    min_spot_points: 5                  # 最小点数阈值 (单体节点用)
    top_surface_tolerance: 0.03        # 顶面 Z 容差 (m)
    top_surface_min_points: 3          # 顶面最少点数
    empty_max_height: 0.05             # EMPTY 高度上限 (m)
    one_earth_min: 0.20                # ONE_EARTH 区间 (m)
    one_earth_max: 0.45
    two_earth_min: 0.55                # TWO_EARTH 区间 (m)
    two_earth_max: 0.80
    complete_tower_min: 0.80           # COMPLETE_TOWER 区间 (m)
    complete_tower_max: 1.10

    # ── 调试 & 看门狗 ──
    # ═══════════════════════════════════════════════════════════════════════
    # 中间结果话题发不发（2026-09-24 新增）
    # ═══════════════════════════════════════════════════════════════════════
    # ⚠️⚠️ 它**不是调试开关** —— 本键只管 **2 条数据接口话题**：
    #      `filtered`（1 个订阅者：`ground_segmenter`）
    #      `non_ground`（3 个订阅者：`building_spot_analyzer` / `cluster_extractor` /
    #                    `cylinder_detector`）
    #    ⇒ 它们是**容器化拓扑里 4 个组件的输入**。关掉 = 组件链饿死，症状是
    #      "组件全都不出结果"，与"代码坏了"长得一样（跑单体时**完全看不出来**）。
    #    ⚠️ 另外 8 条（ground / l0..l2_surface / ground_plane / pillars / obstacles /
    #       building_spots / debug_cloud）实测**零订阅者**，是纯可视化 ⇒ 仍挂
    #       `debug_enabled`（比赛关掉没人饿死）。**两组语义不同，别合并**。
    #    ⚠️ 数字要复核就跑 `python3 scripts/check_topic_consumers.py`（就是那句纪律的自动化）。
    #
    # ⚠️ **为什么它不放在 `config/debug_flags.yaml`**（虽然那里是"发不发"类开关的
    #    唯一事实源）：那个文件的职责写着"**比赛时全部关闭以节省性能**"，
    #    而本键的默认是 **true（发）** —— 放进那个文件就等于请人把它当调试开关关掉，
    #    而关掉的后果是"组件全都不出结果"。语义不同 ⇒ 位置不同。
    # ⚠️ 与 `debug_enabled` 的分工（**别互相替代**）：
    #      `publish_intermediate_topics` = 数据接口有没有消费者（默认 **true**）
    #      `debug_enabled`               = 给人看的东西（`debug_cloud`/RViz 装饰，默认 false）
    #
    # 判据：**关之前先列出订阅者** —— `python3 scripts/check_topic_consumers.py`
    # 什么时候可以置 false：确认"**单体独占、组件不在场**"时（省下 6 次整份点云拷贝）
    publish_intermediate_topics: true

    # ⚠️ `debug_enabled` **已移走**，别再往这里加回来：
    #    调试开关的**唯一事实源**是 `config/debug_flags.yaml`。
    #    原先这里写着 `true`，而 debug_flags.yaml 里是 `false` —— 谁生效取决于
    #    launch 里 parameters 的**先后顺序**（后者覆盖前者）。那是**脆的**：
    #    调一下顺序、或新写个 launch 忘了排最后，"比赛全关"就**静默失效**，
    #    不报错，只是调试点云又开着了。删掉重复键之后只依赖内容，不依赖顺序。
    #    ⚠️ 节点里这个参数的默认值本来就是 `false`
    #       （`lidar_perception_node.hpp:435`），所以**单独传本文件也是安全的**。
    watchdog_timeout: 1.0              # 雷达超时阈值 (秒)
    max_skip_frames: 3                 # 最大连续跳帧数

    # ── 2026-09-20 补齐: 代码 declare 但配置漏掉的键 (原先读不到, 配置改了不生效) ──
    cylinder_mask_radius:          0.5   # 屏蔽区半径
    cylinder_mask_x:               0.0   # 屏蔽区中心 x
    cylinder_mask_y:               0.0   # 屏蔽区中心 y
    enable_cylinder_mask:          false   # 圆柱检测时屏蔽自身
    enable_self_filter:            false   # 自过滤开关 (机器人自身点云剔除)
    height_threshold_values:       [0.04, 0.06, 0.10]   # 分层高度阈值表
    height_threshold_z_keys:       [l0_height, l1_height, l2_height]   # 分层高度键名
    self_radius_x:                 0.35   # 机器人半宽 (BR 700mm/2)
    self_radius_y:                 0.35   # 机器人半长
    self_radius_z:                 1.20   # 机器人高

    # ═══════════════════════════════════════════════════════════════════════
    # ✅ 2026-09-23 **别名键已删**（原先这里挂着 3 个 `≡` 键）
    #
    # 原状: 雷达层有**两份实现**在读同一个参数但**键名不一致** ——
    #   · `lidar_perception_node.cpp`(单体) 读 ransac_dist_thresh / ransac_max_iters / top_surface_min_pts
    #   · `ground_segmenter.cpp` / `building_spot_analyzer.cpp`(组件) 读
    #     ransac_distance_threshold / ransac_max_iterations / top_surface_min_points
    # 所以三个参数各挂了**两个名字**，靠"两个都写、值一样"维系 ——
    # 那是**两处真源**：改一个忘一个，被弃用的那一半就**静默退回代码默认值**。
    #
    # 处置（已做）: **把单体侧统一到组件的名字**，然后删掉别名。
    #   ⚠️ 是行为保持的 —— 删之前逐对核过值一致（0.04/0.04、100/100、3/3）。
    #   ⚠️ 顺带也把"容器化重构后再删"这个**挂账条件解除了**：现在就可以删，
    #      因为两份实现读的是同一个名字了（重构要消的是**实现**的重复，不是名字）。
    # ⚠️ 别再往这里加 `≡` 别名键。要用新参数，**两边代码用同一个名字声明**。
    # ═══════════════════════════════════════════════════════════════════════
    # （三种名字统一后的键就在上面各自的段落里，本段不再重复列出）
