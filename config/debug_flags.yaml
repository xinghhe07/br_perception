# ═══════════════════════════════════════════════════════════════════════════════
# config/debug_flags.yaml — 调试开关（任务书 §1.7）
#
# **职责：比赛时全部关闭以节省性能。**
#
# ⚠️⚠️ **本文件是这些开关的唯一事实源。** 同名键**不许**再出现在模块自己的 yaml 里
#     （`lidar_params.yaml` / `comm_params.yaml` 里原先各有一份，已于 2026-09-23 删除）。
#     为什么较真这一条：靠"launch 里谁排后面谁生效"来定值是**脆的** ——
#     谁调一下 parameters 顺序、或新写个 launch 忘了排最后，"比赛全关"就**静默失效**：
#     不报错，只是调试点云又开着了。**删掉重复键之后，只依赖内容，不依赖顺序。**
#
# ⚠️ 但**传不传仍然是有区别的**：本文件必须被 launch 传给节点才生效
#     （ROS 2 对未声明的参数静默忽略）。见文件末尾"接线状态"。
#
# ⚠️ 每个键都标了**消费者**与（对本文件 §二 的那些）**接线到期条件** ——
#     没有到期条件的占位键会**永久挂账**，那正是这个仓库最想避免的。
#     ⚠️ 自动核对：`python3 scripts/check_param_consumers.py`（能抓出无消费者的键、
#        以及**同名键出现在多个 yaml** —— 后者就是"两处真源"）。
# ═══════════════════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ═══════════════════════════════════════════════════════════════════════════
    # 一、**已接线**的开关（改这里立刻有效）
    # ═══════════════════════════════════════════════════════════════════════════

    # 调试输出总开关（雷达层）。
    # 消费者：`lidar_perception_node.cpp:463`，门控 `publish_debug_cloud()`。
    # 默认：节点里就是 `false`（`lidar_perception_node.hpp:435`），本文件与之一致 ——
    #       所以**单独传 lidar_params.yaml 也是安全的**（那边已删掉同名键）。
    # ⚠️ 名字取宽不取窄（**故意不叫** `publish_debug_pointcloud`）：
    #    底下这段不是"只关点云"的意思，而是"雷达层可视化输出总闸"。
    #    台账 §四 已记着几处**尚未挂到本闸下**的可视化输出（见下方"已知缺口"），
    #    将来接上时不该再改名字。窄名字会误导下一个接线的人。
    debug_enabled: false

    # 调试模式（通信层）：串口额外发 `0x7F` ASCII 日志帧。
    # 消费者：`comm_node.cpp:115`
    # ⚠️ **下位机侧对 0x7F 没有规格**（`protocol_encoder.hpp` 的 `DEBUG` 注释写着"未实现"），
    #    比赛时务必关。
    # ✅ 2026-09-23 **接线完成**：`comm_node` 已挂进 `bringup_full.launch.py`（第 7 节），
    #    并把本文件一起传给了它。
    #    ⚠️ 原先是"接线缺口"：`comm_node` 不在任何 launch 里，而它**必须**拿到本文件，
    #       否则总闸对串口调试帧不生效 —— 且它会读到自己的默认值 `false`，
    #       **症状上"碰巧是对的"，把"接线漏了"这件事掩盖掉**。
    #       这正是 §零 第一宗旨"稳"那条要防的形态（看着配好了，实际没接上）。
    debug_mode: false

    # ═══════════════════════════════════════════════════════════════════════════
    # 二、任务书 §1.7 规定、但**尚未接线**的开关
    #     ⚠️ 现在改它们**没有任何效果**（没有节点 declare 过）。
    #     ⚠️⚠️ 每个键**必须带"接线到期条件"** —— 没有到期条件的占位键会永久挂账。
    # ═══════════════════════════════════════════════════════════════════════════

    # 发布带检测框标注的**图像**（不是点云）。
    # 接线到期条件：相机层需要"把框画回图上"时（目前 `camera_debug.rviz` 没有这一项，
    #               检测结果走的是结构化消息）。属于 P1/联调期，不阻塞比赛。
    publish_debug_image: false

    # 异常时保存现场数据（崩溃转储）。
    # 接线到期条件：需先定策略 —— 存什么/存哪/多大/何时清。
    #               ⚠️ 迷你主机磁盘有限，一旦打开**必须有容量上限**，
    #               否则现场跑一天把盘写满，比不存更糟。属于 P1。
    save_crash_dump: false

    # **比赛期锁定参数**：拒绝运行期的参数 set 请求（防手抖改错）。
    # 接线到期条件：在节点的 `add_on_set_parameters_callback` 里拒绝 set。
    #               归 `health_monitor`（模块 26，⬜）或各节点自查。P2。
    # ⚠️ 语义是"**拒绝 set 请求**"，不是"能不能调参" ——
    #    ROS 2 的参数**永远可 set**（`ros2 param set`），所以别指望有个开关能让它不可调。
    #    （原规格写的 `rqt_reconfigure_enabled` 已删 —— ROS 2 里根本没有 rqt_reconfigure，
    #      那是 ROS 1 的工具；留一个恒 false 的开关会让人误以为"运行期不能调参"。）
    lock_parameters: false

    # ── 热管理（任务书 §13）—— ⚠️ **默认开启**，与上面那些调试开关方向相反 ──
    # 全部消费者：`health_monitor`（模块 26，⬜ **尚未编写**）。
    # 接线到期条件：**health_monitor 落地时**。在那之前改它们不会有任何行为变化。
    # ⚠️ 方向别搞反：调试开关比赛时关，热管理比赛时**保持开启**
    #    （本机 GMKtec NucBox K6 长时间跑会降频，要靠它保命 ——
    #      原文写"无风扇的迷你主机"，而"无风扇"**未复核**，2026-09-25 记）。

    thermal_management_enabled: true
    cpu_temp_warn_threshold: 85.0      # 触发降级的温度 [°C]
    cpu_temp_recover_threshold: 75.0   # 恢复温度（滞回；必须明显低于触发温度）

    # ⚠️⚠️ **降级时停哪一路的 ONNX —— 待决策，不是改名就完事**
    #    原规格叫 `thermal_rear_preview_*`（"后相机"），但全仓库已于 2026-09-21 改成
    #    **wide/tele 且两路都朝前**。原策略的前提是"后相机仅防碰撞、可牺牲"，
    #    **那个前提已经不成立**：两路工业相机**都承担识别**
    #    （宽角扫建筑位 / 长焦判塔顶颜色）。
    #    所以这不是改名问题，是**策略要重新论证**：
    #      · 取 "tele" → 保宽角扫场，牺牲塔顶颜色判读（40/80 分那项）
    #      · 取 "wide" → 保长焦判色，牺牲全场地毯式搜索
    #      · 取 "both" → **两路都降频/降分辨率**，而不是关掉一路
    #    ⇒ 待定期间**保持 tele**（沿用原规格"牺牲长焦以外那路"的倾向，但理由已不同）。
    thermal_degrade_camera: "tele"     # 取值: "wide" / "tele" / "both"

    # 降级时该路的原始帧预览频率 [Hz]（不跑 ONNX）
    thermal_preview_hz: 5.0
    thermal_preview_enabled: true

    # ═══════════════════════════════════════════════════════════════════════════
    # 三、**刻意删除**的键（留墓碑，别再抄回来）
    # ═══════════════════════════════════════════════════════════════════════════

    # ~~publish_debug_pointcloud~~ —— 与 `debug_enabled` 是**同一件事**，
    #   两个名字并存就是"两处真源"。统一用 `debug_enabled`（它已接线，语义更宽）。
    #   ⚠️ 别再抄回来。
    #
    # ~~log_timing~~ —— `timer_utils` 的 `StageProfiler` **一直在算**（数据是有的），
    #   这个开关控制的是"记不记"，**关掉它省不了 CPU**。要它有意义得先定义"记到哪"。
    #   目前没有任何节点按它分支。**暂不设键** —— 等真有记录目标（写文件/发话题）时再加。
    #
    # ~~log_detection_detail~~ —— 同上，没有记录目标。且它一旦打开会**逐目标打日志**，
    #   一次全场扫描可能几十条/帧。**暂不设键**。
    #
    # ~~publish_tf_tree~~ —— 改名并收窄语义为 `visualize_tf_tree`（见下方说明后**未保留**）：
    #   TF **广播没有开关，也不允许有** —— 融合层依赖它，关掉等于把融合打掉。
    #   原键名会让人以为"能关 TF"，是个危险的暗示。真要可视化 TF 树是 RViz 的事，
    #   不需要节点参数。**暂不设键**。

# ═══════════════════════════════════════════════════════════════════════════════
# 接线状态（传不传是有区别的）
# ═══════════════════════════════════════════════════════════════════════════════
#
# ✅ 已传：`bringup_full` / `bringup_lidar_only` / `lidar_perception`
#          —— 三处都排在 `lidar_params.yaml` **之后**（虽然重复键已删，顺序不再影响
#             取值；但保持"总闸排最后"的习惯，将来加入新键时不会踩顺序坑）
# ✅ 已传：`comm_node`（2026-09-23 挂进 `bringup_full` 第 7 节，可用 `comm:=false` 关掉）
#
# ═══════════════════════════════════════════════════════════════════════════════
# ✅ 已处置（2026-09-24）：`publish_intermediate(...)` —— **但故意不挂在本闸下**
# ═══════════════════════════════════════════════════════════════════════════════
# 2026-09-23 曾把 `lidar_perception_node.cpp` 的 `publish_intermediate(...)`（10 条话题）
# 挂到 `debug_enabled` 下，**依据是一张"代码订阅者 0"的表 —— 那张表是错的**。
#
# 2026-09-24 逐条实测（**看 `create_subscription` 那个调用块**数出来的，
# 表在 `lidar_perception_node.cpp` 调用处；复核跑 `scripts/check_topic_consumers.py`）：
#   · filtered          → **1** 个代码订阅者（ground_segmenter）  ← **是数据接口**
#   · non_ground        → **3**（building_spot_analyzer / cluster_extractor /
#                                cylinder_detector）              ← **是数据接口**
#   · ground / l0_surface / l1_surface / l2_surface /
#     ground_plane / pillars / obstacles / building_spots / debug_cloud → **各 0**
#
# ⚠️ 中间走过一次弯路：先用 `grep -l "<话题>" src/` 数，得出"10 条里 9 条有订阅者"
#    —— 那是错的，`grep -l` **把发布者也数进去了**。10 条里其实是 **2 条**数据接口。
#
# ⇒ 处置：**拆成两半**（2026-09-24）——
#    · 那 2 条数据接口 ⇒ 挂 **`publish_intermediate_topics`**（默认 **true**）。
#      ⚠️ 它**故意不放进本文件** —— 本文件的职责是"比赛时全部关闭"，
#      把一个默认"发"的数据接口开关放进来，等于请人把它当调试开关关掉。
#      它现在在 `config/lidar_params.yaml`（连同"为什么不在本文件"的理由）。
#    · 那 8 条纯可视化 ⇒ **留在本闸下**（`debug_enabled`）—— 关掉没人饿死。
#   ⇒ 比赛模式下中间结果只剩 **2 次**整份点云拷贝（原来 6 次）。
#
# ⚠️ **纪律（2026-09-24 立；台账 §八 有账）**：
#    **把一个话题挂到任何开关下之前，先列出它的订阅者。**
#    · 数据话题（有订阅者）→ `publish_intermediate_topics` 这类**拓扑开关**
#    · 纯可视化（零订阅者）→ 本闸 `debug_enabled`
#    这条动作已自动化：`python3 scripts/check_topic_consumers.py`
