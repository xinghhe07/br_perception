# ═══════════════════════════════════════════════════════════════════════════
# 场地几何配置 — ROBOCON 2027  (BR 感知系统)
# ===========================================================================
# 本文件由团队根据官方规则书 v1.1 + 实测坐标**直接填写**。
# 坐标系: 原点 = 场地西南角, X 东, Y 北, Z 上; 单位 = 米(m)。
# 红队(我方)在西半场, 蓝队在东半场, 中轴 x=5.5。
#
# 2026-09-09 更新: 全部区域位置/大小按 C:\学习\地图.SLDPRT 线稿实测回填
#   (线稿 = 各区域边界俯视框, 用户确认尺寸精确; 围栏宽 20mm、高 50mm,
#    模型场地平面: X 东/北向取线稿 Y, SW 实体仅作高度参照)
# ✅ CONFIRMED-SW = 按 SW 地图线稿实测
# ⚠ PENDING      = SW 未画 / 待官方图2 数值回填 (见文末清单)
# ═══════════════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ── 1. 场地基础 ──
    field:
      origin: [0.0, 0.0]            # CONFIRMED-SW 场地外框 (0,0)-(11,11), 草图1
      size:   [11.0, 11.0]          # CONFIRMED-SW 11000×11000mm

    ground_level:
      z: 0.0

    # ── 2. 平台 (CONFIRMED-SW, 草图7/10) ──
    l1_platform:
      # ✅ 6×6 = 台面**总**尺寸 (官方 `二层基座` X/Z 恰 ±3000)
      #   2026-09-17 按官方 `2区栅栏` 更正: 周界屏障厚 50mm, 外沿与台面边齐 → 站在台面**里侧**
      #   x[2.50,2.55] / [8.45,8.50] (旧记"立在净台面外面 x[2.48,2.50]"与官方不符)
      height: 0.6                   # CONFIRMED 600mm (实体高差 0.6)
      center: [5.5, 5.5]
      half_size: [3.0, 3.0]         # 6000×6000mm
      x_range: [2.5, 8.5]           # CONFIRMED-SW 草图7
      y_range: [2.5, 8.5]           # CONFIRMED-SW

    l2_platform:
      height: 0.9                   # CONFIRMED 900mm
      center: [5.5, 5.5]
      half_size: [1.5, 1.5]         # 3000×3000mm
      x_range: [4.0, 7.0]           # CONFIRMED-SW 草图10
      y_range: [4.0, 7.0]           # CONFIRMED-SW

    # ── 3. 转运/存储/共享区 ──
    transfer_zone:                  # 1000×1000mm
      # ✅ 用户确认: 转运区 = 草图44 (楼梯顶端与 L1 同高的 1×1 平台)
      platform_z: 0.6               # ✅ 与 L1 齐平 (草图44 = 楼梯顶平台, SW 实体 z→0.60)
      ours:
        center: [2.0, 4.2]          # ✅ CONFIRMED-SW 草图44: x[1.5,2.5] y[3.7,4.7]
        corners: [1.5, 3.7, 2.5, 3.7, 2.5, 4.7, 1.5, 4.7]
      theirs:
        center: [9.0, 4.2]          # ✅ CONFIRMED-SW: "镜向1" 生成蓝侧同构体, 草图46 蓝侧 x=8.5 有同样的 y[3.7,4.7] 开口
        corners: [9.5, 3.7, 8.5, 3.7, 8.5, 4.7, 9.5, 4.7]

    storage_zone:                   # 1000×2000mm
      # ✅ 2026-09-17 按官方 `1区储存区-红/蓝` 更正: 贴边**齐平**, 不再内缩 20mm
      #   官方 X {-5500,-3500} / Z {-5500,-4500} → 场地 x[0,2] y[10,11] (2000×1000)
      ours:
        center: [1.00, 10.50]       # 红方西北角
        corners: [0.0, 10.0, 2.0, 10.0, 2.0, 11.0, 0.0, 11.0]
      theirs:
        center: [10.00, 10.50]      # 蓝方东北角 (镜像 x'=11−x)
        corners: [9.0, 10.0, 11.0, 10.0, 11.0, 11.0, 9.0, 11.0]

    ground_shared_zone:             # 圣所(穆斯蒂卡柱)地面共享区
      center: [5.5, 9.75]           # ✅ CONFIRMED-SW 草图3/33: 北端中央
      half_size: [0.5, 0.5]         # ✅ CONFIRMED-SW (5,9.25)-(6,10.25), 带X对角纹
      mustika_surround:             # 1000×1000mm
        half_size: [0.5, 0.5]

    l1_shared_zone:
      # ✅ 2026-09-11 用户确认: 带宽 = 外 1000×750、内 500×500 (内框居中于外框, 每边留 250)
      #    → 宽度取 1.0 (x[5.0,6.0]); SW 草图23 画成 x[4.95,6.05] = 1.1, x 向多 50/边、y 向留 250, 不对称 = 画歪
      #    → 原 PENDING "1.1 vs 官方 1.0" 关闭, 官方 1.0 为准
      description: "L1 中轴共享带 (x[5.0,6.0], 每队半带 500); 南北两端各一组 {外框 (草图23) ⊃ 内框 (草图20)}; 中段净空 y[3.27,7.73]"
      platform_z: 0.6               # ✅ 共享带在 L1 台面上
      band_width: 1.0               # ✅ 外框宽 1000
      outer:                        # 外框 1000×750 (草图23; SW 的 1.1 宽已修正)
        size: [1.0, 0.75]
        half_size: [0.5, 0.375]
      inner:                        # 内框 500×500 (草图20), 居中于外框, 每边留 0.25
        size: [0.5, 0.5]
        half_size: [0.25, 0.25]
      ours_band_x: [5.0, 5.5]       # ✅ 红半带 500 宽
      theirs_band_x: [5.5, 6.0]     # ✅ 蓝半带 500 宽
      ends:                         # 两端框位 (红蓝同 x, 沿中轴对称)
        south:                      # 南端
          outer_y_range: [2.55, 3.30]   # ✅ 草图23, 750 深 (2026-09-17 随建造位同步 +30mm)
          inner_y_range: [2.55, 3.05]   # ✅ 官方便是该内框 (建造点 L1_SHARED_S), 500 深, 贴南缘
        north:                      # 北端
          outer_y_range: [7.70, 8.45]   # ✅ 草图23, 750 深 (同上)
          inner_y_range: [7.95, 8.45]   # ✅ 官方 L1_SHARED_N, 500 深, 贴北缘

    l2_shared_zone:
      description: "整个 L2 平台为共享区 (CONFIRMED)"
      center: [5.5, 5.5]
      half_size: [1.5, 1.5]

    # ── 4. 柱子 ──
    mustika_pillar:                 # 高500mm Ø270mm (CONFIRMED-SW: 实体拉伸8 z 0→0.50)
      position: [5.5, 9.75]         # ✅ CONFIRMED-SW 圣所中心, 草图3/33 + 实体拉伸8 (Ø~0.26)
      height: 0.5                   # ✅ OFFICIAL 500mm, SW 实体 0→0.50 印证
      diameter: 0.27                # ✅ OFFICIAL Ø270 (SW 量得 Ø~0.26)
      radius: 0.135
      receptacle:                   # ✅ OFFICIAL 顶部凹槽, 用于托住穆斯蒂卡球
        diameter: 0.18              # Ø180
        depth: 0.10                 # 深 100mm

    core_pillar:                    # 高800mm Ø270mm (CONFIRMED-SW: 实体拉伸6 z 0.90→1.70)
      position: [5.5, 5.5]          # ✅ CONFIRMED-SW 实体拉伸6, L2 顶中央
      height: 0.8                   # ✅ OFFICIAL 800mm, SW 实体 0.90→1.70 印证
      diameter: 0.27                # ✅ OFFICIAL Ø270 (SW 量得 Ø~0.26)
      radius: 0.135
      receptacle:                   # ✅ OFFICIAL 顶部凹槽, 安放穆斯蒂卡
        diameter: 0.18              # Ø180
        depth: 0.10                 # 深 100mm

    # ── 5. 建筑位 (500×500mm) ──
    building_spots:
      spot_size: 0.5
      spot_half_size: 0.25
      # ✅ 2026-09-11 用户确认: "L1 上中间对称轴上的 2 个 500×500 是共享的"
      #   = l1_shared_zone 的南北内框 (草图20), 跨中轴 x[5.25,5.75]
      # 结构注 (2026-09-12 实测): 必须写成 "id → 位姿" 的 map。
      #   ROS 参数解析器不支持"列表套 map"(序列元素为 map), 旧写法会让任何加载本文件的
      #   节点在构造时抛 parameter_value_from 异常并 SIGABRT 退出。
      # ✅ 2026-09-17 按官方 `建造点` 顶点更正: L1 六位中心 2.77/8.23 → **2.80/8.20**
      #   (官方 10 个建造点实例包围盒: L1 = X/Z ∈ {±2450..±2950} 或 {±250} → 中心 2.80/8.20/5.5)
      shared:
        L1_SHARED_S: { center: [5.5, 2.80], x_range: [5.25, 5.75], y_range: [2.55, 3.05] }
        L1_SHARED_N: { center: [5.5, 8.20], x_range: [5.25, 5.75], y_range: [7.95, 8.45] }
      # ✅ L1 四角位 (草图9 的 4 个 0.5×0.5 角块, 中心 2.80/8.20 — 与官方一致)
      l1_corners:
        L1_R_SW: { center: [2.80, 2.80], x_range: [2.55, 3.05], y_range: [2.55, 3.05] }  # 红(西)
        L1_R_NW: { center: [2.80, 8.20], x_range: [2.55, 3.05], y_range: [7.95, 8.45] }  # 红(西)
        L1_B_SE: { center: [8.20, 2.80], x_range: [7.95, 8.45], y_range: [2.55, 3.05] }  # 蓝(东)
        L1_B_NE: { center: [8.20, 8.20], x_range: [7.95, 8.45], y_range: [7.95, 8.45] }  # 蓝(东)
      # ✅ 2026-09-11 用户确认 "1没得": 西/东列在 y=5.5 中间行**没有位** → L1 就是这 6 个
      # SW 列带实测 (L1): 西列 x[2.52,3.02] 中心2.77 | 中列 x[5.25,5.75] 中心5.5 (=共享列)
      #                  东列 x[7.98,8.48] 中心8.23; 纵向覆盖 y[2.52,8.48]
      # ✅ L2 = 4 个角位 = **草图54 (L2 放置区)** 的 4 个 0.5×0.5 角块
      #   2026-09-11 用户原话: "l2 4个角4个" / "54是l2放置区"; 草图20 用户原话: "是l1共享的"
      #   2026-09-11 更正: 早前"L2 无线稿依据"的判断有误 — 当时只搜了 x≈4.25/6.75 的中心线,
      #   而草图54 画的是 4.0/4.5/6.5/7.0 的**边**线, 故漏检。
      l2_corners:
        L2_SW: { center: [4.25, 4.25], x_range: [4.0, 4.5], y_range: [4.0, 4.5] }
        L2_SE: { center: [6.75, 4.25], x_range: [6.5, 7.0], y_range: [4.0, 4.5] }
        L2_NE: { center: [6.75, 6.75], x_range: [6.5, 7.0], y_range: [6.5, 7.0] }
        L2_NW: { center: [4.25, 6.75], x_range: [4.0, 4.5], y_range: [6.5, 7.0] }
      # 原 l1: [] / l2: [] 空表已删 (2026-09-12): 空数组会解析成"无值参数", 同样让节点
      # 构造失败; 且已由 l1_corners / l2_corners 取代, 无代码读取。
      # (节点实际读的是第 11 节兼容层 building_spot_x/y/z, 共 10 个位)

    # ── 6. 围栏/中心分隔 ──
    fences:
      # ✅ 2026-09-11 用户明确: "11×11 / 6000 都是**不算围栏**的净尺寸" → 围栏立在净区**外面**
      #    (x_range/y_range 给的 0..11 与 2.5..8.5 都是净尺寸; 围栏不占这些尺寸内部的空间)
      description: "场地外圈围栏 (Game Field Boundary), 立在 11×11 净区之外 (x[-0.05,0] / [11,11.05] …)"
      width: 0.05                   # ✅ 2026-09-17 按官方 `1区栅栏` 更正: 20mm → **50mm**
                                    #   顶点去重 X = {±5550, ±5500} → 环厚 50, 内沿恰在 ±5500 (= 净区边)
                                    #   (旧值 20mm 来自 SW 线稿模型, 与官方总装配不符)
                                    #   同一值也决定地面板外扩量 → 板 = 11.1×11.1 (官方 `红1区` 恰 ±5550)
      height: 0.10                  # ✅ 2026-09-14 按官方总装配更正: 50mm → 100mm
                                    #   官方模型 `1区栅栏` 包围盒 Y 25→125 (地面以上 100mm)
                                    #   旧值 50mm 来自 SW 实体拉伸19, 疑为 L1 屏障而非外圈围栏
      outside_clear_area: true      # ✅ 围栏在净区外侧, 不侵入 11×11
      segments: [0.0, 0.0, 11.0, 0.0, 11.0, 0.0, 11.0, 11.0, 11.0, 11.0, 0.0, 11.0, 0.0, 11.0, 0.0, 0.0]
    center_divider:
      description: "中轴隔墙 (x=5.5, **50mm 宽 × 100mm 高**): 地面段**跑满 y[0,11]** 由两处共享区断开, L1 段 y[3.3,7.7]"
      # ✅ 2026-09-17 官方实测 —— 隔墙不是独立零件, 藏在 `1区栅栏`/`2区栅栏` 内部:
      #   地面 x[5.475,5.525] **跑满 y[0,11]**, 只被两处共享区断开; L1 段 y[3.3,7.7] (中段埋 L2 里)
      # ⚠ 二次更正: 上一版收窄成 y[1.85,9.25] 是**只看包围盒**的错 —— 南北两截贴围栏的短墙
      #   藏在 `1区栅栏` 那个 80 点的"外圈围栏"实体**内部**。要拆到**实体的顶点**才看得见
      #   (`.tmp_pdf/probe_ring_entities.py`)。
      wall_width: 0.05
      wall_height: 0.10
      ground_y_range: [0.0, 11.0]      # ✅ 官方实测: 南起围栏 y=0, 北至围栏 y=11
      # 地面段被这两处共享区断开 (区间内无墙) —— **拍平成 [y0,y1, y0,y1]**
      # ⚠️⚠️ **原先写成嵌套数组 `- [0.65,1.85]`，它让 `bringup_debug.launch.py` 整份起不来**
      #    （2026-09-25）：本文件是**双重身份** —— 既是生成器 `make_field_from_config.py`
      #    的输入，又**整份作为 ROS 参数文件**传给 `sky_block_detector`（`/**` 通配）。
      #    而 `launch_ros` 的 `normalize_parameter_dict` **不认识"列表套列表"**：
      #    它只认全 float / 全 int / 字符串三种数组，遇到嵌套就走到"当成替换列表"的
      #    兜底分支，再对里面的 float 元素抛
      #      `TypeError: Failed to normalize given item of type '<class 'float'>'`
      #    ⇒ 不是"这个参数失效"，是**整个 launch 失败**。
      #    ⇒ **本文件里任何键都不能是嵌套数组**（哪怕没有节点会读它 —— launch 会读全部）。
      # ⚠️ 拍平也是本文件既有惯例（同节的 `segments: [5.5, 0.0, 5.5, 11.0]` 就是拍平的成对点）。
      #    消费方只有一个：`scripts/make_field_from_config.py`（已同步改成两两配对）。
      ground_breaks_y: [0.65, 1.85, 9.25, 10.25]
      #                  └─ 南: 天空棋盘外框 (≡ sky_blocks.outer_y_range)
      #                      北: 圣所地面共享区 (≡ ground_shared_zone) ─┘
      l1_y_range: [3.3, 7.7]           # ✅ 官方实测 (可见部分 = 减去 L2 的 y[4,7])
      segments: [5.5, 0.0, 5.5, 11.0]  # 兼容层: 只给地面段总跨度 (render_map.py 画不成多段)

    # ── 7. 楼梯 + 坡道 (CONFIRMED-SW 2026-09-11: 用户确认草图40/41/43=3阶, 44=顶, 45+44一边=斜坡) ──
    # 红侧西竖带 x[1.5,2.5], 自南向北: 3 级阶梯 → 顶平台 44(=转运区) → 坡道; 蓝侧 x[8.5,9.5] 由"镜向1"镜像
    stairs:
      description: "上 L1 阶梯 (草图40/41/43): 红 x[1.5,2.5] y[2.8,3.7]; 3 级踏面各 0.3 深、高差 0.15, 自南(y2.8)向北爬升; 第 3 级后缘 y=3.7 接转运区平台 44; 蓝镜像 x[8.5,9.5]"
      ours:
        from_xy: [1.5, 2.8]         # ✅ 第 1 级前缘 (南)
        to_xy:   [1.5, 3.7]         # ✅ 第 3 级后缘 (北, 接草图44)
        band_x: [1.5, 2.5]
        height: 0.6                 # 总升高到 L1 面
        step_height: 0.15           # 3 级 ×150mm (3 级踏面 + 登上 44 = 4 次升高 ×0.15 = 0.6)
        step_count: 3
        tread_depth: 0.3            # ✅ CONFIRMED-SW 草图40/41/43 各级 y 跨度均 0.3
      theirs:
        from_xy: [9.5, 2.8]
        to_xy:   [9.5, 3.7]
        band_x: [8.5, 9.5]
        height: 0.6
        step_height: 0.15
        step_count: 3
        tread_depth: 0.3
    ramp:                           # ✅ CONFIRMED-SW 草图45 (拉伸18): 3500mm 坡道
      description: "斜坡 (草图45, 直角三角形剖面): 红 x[1.5,2.5] y[4.7,8.2]; 北端 y=8.2 接地 z=0, 南端 y=4.7 升至 L1 面 z=0.6, 与转运区平台 44 的北边共边; 长 3.5 与规则 3.4.5 的 3500mm 坡道吻合; 蓝镜像 x[8.5,9.5]"
      ours:
        band_x: [1.5, 2.5]
        low_xy:  [2.0, 8.2]         # ✅ 接地端 (北)
        high_xy: [2.0, 4.7]         # ✅ 顶部, 接草图44 北边 (南)
        run: 3.5
        width: 1.0
        rise: 0.6
        slope_deg: 9.7
      theirs:
        band_x: [8.5, 9.5]
        low_xy:  [9.0, 8.2]
        high_xy: [9.0, 4.7]
        run: 3.5
        width: 1.0
        rise: 0.6
        slope_deg: 9.7
    l1_l2_stairs:                   # ✅ CONFIRMED-SW 草图25 / 拉伸7: L1→L2 阶梯 (2026-09-11 用户确认)
      # 草图25 是两条 0.3×1.0 分离小条 (非贯通矮带); 拉伸7 包围盒 x[3.7,7.3] Z[0.75,0.9] 只是两者合并后的 bbox
      # 实体从 L1 顶 (SW 0.75) 升到 0.9 = 中间踏面 (场地 z 0.75 = L1+0.15), 再上 0.15 即 L2 (0.9)
      description: "L1 上 L2 阶梯: **1 级 ×150mm** (0.6 → 0.75 踏面 → 踩 L2 完成第 2 次升高至 0.9); 台块 0.3 宽×1.0 深; 位于 L2 西/东边缘 y[5.0,6.0] (正对中轴), 红用西条、蓝用东条"
      step_height: 0.15             # ✅ 用户确认 "也是高 150mm"
      # ✅ 2026-09-17 按官方 `二层台阶-红` 更正: step_count 2 → **1**
      #   官方该零件 Y 625~775 = 只有一块 150 高的台块, 深 1.0 (Z ±500), 正是规则书的
      #   300×1000×150 那一个构件; 到 L2 的第二次 150 是踩上 L2 本身, 中间没有第二级踏面。
      #   (生成器本来就只画一块, 所以世界里的形状一直是对的, 只是这两个数在 config 里写错。)
      step_count: 1
      tread_depth: 1.0
      y_range: [5.0, 6.0]           # ✅ 2026-09-14 官方总装配 STEP 实测 (旧值 [4.88,5.88] 系线稿量取误差)
