# ═══════════════════════════════════════════════════════════════════════════
# comm_node 参数 (任务书 §5.3 / §5.4)
#
# ⚠ 本文件里有 **6 组未冻结参数** —— 没有下位机可确认, 现在都是挑出来的默认值。
#   协议冻结后**只改这个文件**, 不必动 C++:
#     1. CRC16 参数 (任务书 §5.1 只说"多项式从配置读取", 没给具体值)
#     2. 串口物理层 (波特率/数据位/停止位/校验/流控)
#     3. 单帧容量上界 (任务书给的是 16/10, 需与下位机对齐)
#     4. ⭐ 状态标志字节的**位定义** (`0x01` 帧内, 见 protocol_encoder.hpp 的 `StatusFlag`)
#     5. ⭐ `0x03` 紧急停止包的**存在性与 payload 格式** (见 protocol_encoder.hpp 的 `PacketType`/`EstopValue`)
#     6. ⭐ **`BuildingSpot.state` 的取值范围扩到 5 档**（`0..3` → `0..4`，2026-09-24 加）
#        · 新增 **`4 = UNKNOWN`（"没量成"）** —— 语义与 `0 = EMPTY`（"量到了，这里是空的"）
#          **完全不同**：主控看到 `4` 必须**不当成空**（塔明明建着却报 0，它会去重放/重试）。
#        · 走线：`protocol_encoder.cpp:320` **原样写 u8** ⇒ 值本身不需要改编码，
#          但**对端的校验/白名单**（若有 `if state <= 3` 之类的判断）会把它当非法值。
#        · ⚠️ **这是我方单方面拟的**（下位机侧尚未确认）—— 与 4/5 同级：**不要当契约**。
#          ⇒ 对端**最容易踩的坑**：把 `4` 落进 `default` 分支当成 0/EMPTY。
#
#   ⚠️⚠️ **4 与 5 是我方单方面拟的提案, 下位机侧尚未确定 —— 不要当成契约。**
#       2026-09-22 用户明确: "这些 0x03 都是要改的, 下位机还没确定"。
#       落地前必须与下位机逐条对死; **预期会变**, 所以改动成本刻意压到最低:
#         · 帧格式只写在 `protocol_encoder.cpp` 一处 (封帧/CRC 也都在那)
#         · 位定义只写在 `protocol_encoder.hpp` 的 `StatusFlag`/`EstopValue` 两处
#         · 对端照着看的是本节 + 那两个 enum, 不是散落各处的注释
#
#       4 的**破坏性**在于: 那个字节原叫 `odometry_reliable`(0/1), 现在按位用。
#         读 bit0 的老实现**仍然正确**(bit0 语义没动), 但"整字节 0/1"的假设不再成立
#         —— 收到 `0x05` 按 0/1 解读会判成"真", 实际 pose_valid=1 而 odometry=0。
#       5 的**必要性**见 perception_pipeline.hpp 的降级那节: 只发 ROS 话题的紧急停止
#         **STM32 什么也收不到**, 且"感知算不出坐标"与"串口线断了"在主控侧
#         完全不可区分 —— 而这两件事的应对**正相反**。
#
#   另有两条**改不了、必须动代码**的未冻结项:
#     a) "seq 是否跨 PacketType 共享" —— protocol_encoder 目前假设共享
#        (心跳/紧急/调试帧也消耗序号)。若下位机确认独立编号, 需按 type 各维护计数器。
#     b) ⭐ "**连续 N ms 没有 0x01 感知帧 → 主控停车**" 这条契约本身。
#        协议冻结时**必须问死**主控那边到底有没有这个行为:
#          · 若**有** → 感知侧"算不出坐标就不发帧"会直接让主控停车。
#            这与"绝不发错坐标"是**配套的**, 正是想要的效果。
#          · 若**没有** → 那么第 5 项(紧急包)就是唯一的兜底,
#            **它不成立整套降级就不成立**。
#        两种情况都要在下位机侧确认后写进协议文档。
#
#     c) ⭐⭐ **失联兜底: "停车" 与 "松手" 必须拆成两个独立条件。**
#
#        ⚠️ 任务书 §十 原文写的是「心跳丢失超 X ms → STM32 直接进**保守态
#           (松手 + 停车)**」。**照抄会得到一个比赛中乱扔东西的机器人** ——
#           这两个动作的风险完全不对称, 捆在一起是错的。
#
#        · **停车**: 方向对, 应当**立即、无条件**。不停的风险更大 ——
#            规则 6.4「机器人把比赛用品撞出比赛场地…**该用品将被永久移出
#            比赛场地**」+ 犯规; 感知一死就看不见障碍与边界, 盲开还可能撞对手
#            (规则 6.6 阻挡犯规)、从 L1/L2 掉下来。
#
#        · **松手**: ⚠️ **只在终场那一刻是对的**, 比赛中很可能是错的。
#            把规则给的三种结局摆一起就清楚了:
#              · 蜂鸣时仍手持        → **0 分**(规则 8.1.6a: 仍与机器人接触的不计分)
#              · 掉在 L1/传递区/L2   → **5 分/个**(记分表第 2、3 项"散落…")
#              · 掉出场地            → **0 分 + 犯规**(规则 6.4, 用品永久消失)
#            ⇒ 松手只在"0 分 → 5 分"这一档是净赚; 而 BR 在 **L2(高 0.9m)** 上
#              撒手, 弹一下就可能出场, 反而从"手持 0 分"变成"犯规 + 用品永久消失"。
#
#        ✅ **建议的契约**(与下位机谈时按这个提):
#             心跳丢失超 X ms:
#               · 停车 → 立即、无条件
#             · 松手 → **仅当 STM32 自身倒计时进入终场窗口**(如 T-0.5s)才松;
#                     比赛中保持夹持, 等链路恢复由主机判断
#
#        ⚠️ **关键点: 松手的判据用 STM32 自己的时钟, 不依赖主机。**
#           任务书 §十 自己就要求「主机开局同步一次 `match_start_epoch`,
#           之后 STM32 用自身的单调时钟倒计时」—— 那个时钟就是为这件事准备的。
#           主机彻底死了, 到蜂鸣那一刻它照样会松(0 分变 5 分), 而比赛中不会乱扔。
#        ⚠️ **前置**: STM32 侧**必须有**自己的倒计时。没有的话这套方案不成立
#           (它得自己知道何时是终场), 退回去只能二选一 —— 而两个选择都差。
#        ⚠️ 松手门限应与 `0x01` 帧的 `match_end_release_warning` 那条**对齐**,
#           别出现"感知在喊松手、主控还在等自己的门限"这种错位。
#
# ⚠ 改了本文件的 CRC 参数后, **跑这一条**:
#
#       python3 scripts/fake_master.py --check-config config/comm_params.yaml
#
#   它会读出本文件里的 crc16_* 参数, 匹配到对应的标准变体, 并核对 check 值。
#   四条标准变体 (输入 ASCII "123456789"):
#     CCITT-FALSE {0x1021, 0xFFFF, false, false, 0x0000} → 0x29B1
#     XMODEM      {0x1021, 0x0000, false, false, 0x0000} → 0x31C3
#     MODBUS      {0x8005, 0xFFFF, true,  true,  0x0000} → 0x4B37
#     KERMIT      {0x1021, 0x0000, true,  true,  0x0000} → 0x2189
#
#   (别跟 --selftest 混: 那个只验证脚本自己的 CRC 实现, **不读本文件**。)
#
# ⚠ 本文件里每个参数的取值应与 comm_node.cpp 的 declare_parameter 默认值一致 ——
#   不一致的话, 传不传 --params-file 会得到不同行为。改一处记得改另一处。
# ═══════════════════════════════════════════════════════════════════════════

comm_node:
  ros__parameters:
    # ── 话题 ──
    # ⚠ QoS **写死在代码里, 不是参数** (改 QoS 需动 comm_node.cpp):
    #     · /perception/output 的订阅 = SensorDataQoS(BEST_EFFORT)
    #       —— 兼容 RELIABLE 与 BEST_EFFORT 两种发布者。反过来不行:
    #       本节点若用 RELIABLE 去订阅别人的 BEST_EFFORT 发布, 会**静默收不到**
    #       (本仓库踩过一次, 见 doc/容器化重构_任务清单 §已知坑 1)
    #     · from_master / diagnostics 两个发布者 = 默认 RELIABLE depth 10
    output_topic: /perception/output
    from_master_topic: /communication/from_master
    diagnostics_topic: /communication/diagnostics
    diagnostics_interval_sec: 1.0

    # ⚠️ 上游紧急停止 (`std_msgs/Bool`, 发布端 = perception_pipeline)。
    #   订阅后**编码成 0x03 立刻上线** —— 在此之前它只是一条 ROS 话题,
    #   全仓库零订阅者, **STM32 什么也收不到**; 而且"感知算不出坐标"与
    #   "串口线断了"在主控侧完全不可区分, 可这两件事的应对**正相反**。
    # ⚠️ 用默认 QoS(RELIABLE depth 10), 与发布端一致, 见上面"QoS 写死在代码里"。
    # ⚠️ 名字必须与 config/perception_params.yaml 的 `emergency_stop_topic` 逐字一致。
    emergency_stop_topic: /perception/emergency_stop

    # ── 串口物理层 (⚠ 未冻结: 待与下位机确认) ──
    serial_device: /dev/ttyUSB0
    # ✅ 2026-09-20 提到 460800 (原 115200). 依据 —— 端到端延迟:
    #     感知帧 280 B (max_building_spots=16 + max_obstacles=10 算出的上界),
    #     8N1 每字节 10 位:
    #       115200 → 传输 24.3 ms → 端到端 68–76 ms
    #       460800 → 传输  6.1 ms → 端到端 50–58 ms   ← 落在指标 55–60 ms 内
    #       921600 → 传输  3.0 ms → 端到端 47–55 ms   (只再多省 3 ms, 不值)
    #     通道容量: 460800 ÷ 10 ÷ 280 B = **164.6 Hz**, 对 send_rate_hz=50 有 3.3× 余量
    #     (还要分给下行 ACK 与心跳)。
    #   ⚠ 仍属"未冻结项" —— 必须下位机也支持 460800 才能定。定了要同步改
    #     comm_node.cpp 的 declare_parameter 默认值 (见文件头最后一条警告)。
    serial_baud_rate: 460800
    serial_data_bits: 8
    serial_stop_bits: 1
    serial_parity: "N"          # N 无 / E 偶 / O 奇 (大小写不敏感, 实现里会转大写)
    serial_flow_control: false

    # ── 协议 CRC16 (⚠ 未冻结)。默认 = CRC-16/CCITT-FALSE ──
    # ⚠ **值用十进制写** —— ROS 2 的参数解析器对 `0x` 十六进制前缀的支持没有把握,
    #   万一不认, 症状是节点启动时 declare_parameter<int> 抛异常、整个节点起不来。
    #   右边注释是等价的十六进制, 对照协议表时看注释即可。
    # 三项都是 16 位, 取值 [0, 65535]。
    crc16_polynomial: 4129      # 0x1021
    crc16_initial: 65535        # 0xFFFF
    crc16_reflect_in: false
    crc16_reflect_out: false
    crc16_xor_out: 0            # 0x0000

    # ── 单帧容量上界 (⚠ 未冻结) ──
    # 改这里, encoder 的缓冲区预留与 decoder 的长度闸门都会自动跟随
    # (ProtocolConfig::max_payload_bytes 是从这两个字段算出来的, 不是另写常量)。
    # ⚠ 但上界受串口吞吐限制。单帧线上字节 = 36 + 4N + 18M (6B 帧头 + 2B CRC 已计入),
    #   115200 bps (10 bit/字节 → 11520 B/s) 下可持续帧率 = 11520 ÷ (36 + 4N + 18M)。
    #   当前 16/10 → 280 B → 41 fps (2026-09-19 实测 41.3 fps, 吻合)。
    #   发布侧频率必须低于此值: 超容量时 comm_node **不会**降频, 而是丢帧 +
    #   叠加约 1.7s 陈旧度, 且该延迟在诊断里看不见 (只看到 frames_dropped_on_post 在涨)。
    #   注意 N/M 调大会同时压低帧率上限 —— 例: 32/20 → 524 B → 只剩 22 fps。
    max_building_spots: 16
    max_obstacles: 10

    # ── 时序 ──
    send_rate_hz: 50                # 发送线程轮询频率; 心跳精度受它限制
    heartbeat_interval_ms: 1000     # ≤0 = 不发心跳
    reconnect_interval_ms: 1000     # 断线重试间隔
    receive_poll_timeout_ms: 100    # 接收线程单次 poll 等待上限
    crc_alarm_threshold: 10         # 连续 CRC 错误达此数 → crc_alarm

    # ── 调试 ──
    # ⚠️ `debug_mode` **已移走**，别再往这里加回来：
    #    唯一事实源是 `config/debug_flags.yaml`（理由同 lidar_params.yaml 里那段 ——
    #    两处同名键靠 launch 顺序定值，是脆的，且漏传时**症状上碰巧是对的**，
    #    会把"接线漏了"掩盖掉）。
    # ✅ 2026-09-23 **接线完成**：`comm_node` 已挂进 `bringup_full.launch.py`（第 7 节，
    #    可用 `comm:=false` 关掉），并把 `debug_flags.yaml` 一起传给了它。
    #    ⚠️ 在此之前它**不在任何 launch 里** —— 而 `bringup_full` 是**比赛模式**，
    #       也就是说那条链起完是"一条完整的、什么都不输出的链"。
    #       ⚠️ 若将来把它挂到别的 launch，**记得连带传 debug_flags.yaml**。
    debug_interval_sec: 2.0
