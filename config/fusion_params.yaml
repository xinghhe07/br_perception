# ═══════════════════════════════════════════════════════════════════════════
# 融合与追踪参数 — ROBOCON 2027  (v1.7 §1.5)
# ===========================================================================
# 使用方式: ros2 launch br_perception bringup_full.launch.py
#
# 覆盖模块: 17 coordinate_transformer / 18 kalman_tracker / 19 target_associator
#           / 20 lidar_camera_fusion / 21 fusion_node
#
# 里程计 (Point-LIO, ROS2 移植版):
#   - 该移植版的里程计话题是 /aft_mapped_to_init (不是 /Odometry!)
#   - 本方案只用其"纯里程计"输出, 绝对位姿由场地先验重定位提供 (§十.2)
#   - 退化/振动判定见 odometry.* 小节, 输出到 PerceptionFrame.odometry_reliable
# ═══════════════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ═══════════════════════════════════════════════════════════════════════
    # 坐标系名称 (§1.5) — TF 树: world ← odom ← base_link ← {livox_frame, 相机}
    # ═══════════════════════════════════════════════════════════════════════
    world_frame: "world"                     # 世界坐标系 (场地坐标: 原点=西南角, X 东, Y 北)
    odom_frame: "odom"                       # 里程计坐标系 (§4.1; 文档 §1.5 表未列, 本处补)
    robot_base_frame: "base_link"            # 机器人基座
    lidar_frame: "livox_frame"               # 雷达 (Livox Mid-360 出厂 frame_id)
    camera_wide_frame: "camera_wide_frame" # 宽角相机
    # ⚠️ 2026-09-23 更正: 原写"后相机" —— 那是"前/后双相机"时代的残留,
    #    与下方 `static_tf:` 块里 tele 已是"两路都朝前"自相矛盾（任务书 §0: 一宽一长焦）。
    camera_tele_frame: "camera_tele_frame"   # 长焦相机（**朝前**，不是后相机）

    # ═══════════════════════════════════════════════════════════════════════
    # 里程计接口 — coordinate_transformer (模块 17)
    # ═══════════════════════════════════════════════════════════════════════
    odometry:
      topic: "/aft_mapped_to_init"       # Point-LIO (ROS2 移植版) 里程计话题
      imu_topic: "/livox/imu"            # IMU (退化判定用加速度方差)
      degenerate_topic: ""               # Point-LIO 退化标志 (std_msgs/Bool); 空 = 不订阅

      # ── 可靠性判定 (§4.1 v1.5) ──
      timeout_sec: 0.5                   # 里程计超时 → TIMEOUT (数据链路断/TF 断连)
      tf_timeout_sec: 0.05               # TF lookup 超时 → 标记坐标变换不可靠
      imu_variance_window_sec: 1.0       # 加速度方差统计窗口 (s)
      # 加速度模长方差阈值 — 单位 = IMU 原始加速度单位² (Mid-360 输出为 g → g²)
      # 0.25 g² ≈ 0.5g 抖动; ⚠ 现场按坡道实测标定 (触发即 odometry_reliable=false)
      imu_acc_variance_thresh: 0.25
      confidence_decay: 0.5              # 退化时世界坐标置信度系数 (§1.5, 默认 0.5)
      relative_mode_on_degraded: true    # 退化时切相对定位模式 (§1.5, 默认 true)
      tf_publish_rate_hz: 100.0          # TF 广播限频 (高带宽里程计可达 kHz, 感知侧无需同频)
      pose_prior_window_sec: 5.0         # BR_RESET 后位姿注入有效窗口 (s, §4.1 v1.6)

    # ═══════════════════════════════════════════════════════════════════════
    # 时间同步 (§1.5)
    # ═══════════════════════════════════════════════════════════════════════
    temporal_sync:
      max_time_diff: 0.05                # 雷达-相机最大允许时间差 (s), 超出丢弃该关联

    # ═══════════════════════════════════════════════════════════════════════
    # 卡尔曼追踪 (§1.5 — kalman_tracker, 模块 18)
    # ═══════════════════════════════════════════════════════════════════════
    kalman:
      process_noise: [0.05, 0.05, 0.05, 0.10, 0.10, 0.10]  # [dx, dy, dz, dvx, dvy, dvz]
      measurement_noise_lidar: 0.01      # 雷达测量噪声 (位置精确)
      measurement_noise_camera: 0.05     # 相机测量噪声 (分类可靠/位置较粗)
      max_prediction_age: 1.0            # 最大预测时间 (s), 超出删除追踪

    # ═══════════════════════════════════════════════════════════════════════
    # 数据关联 (§1.5 — target_associator, 模块 19)
    # ═══════════════════════════════════════════════════════════════════════
    association:
      max_distance: 0.5                  # 匈牙利匹配最大距离 (m)
      iou_threshold: 0.3                 # 3D IoU 匹配阈值

    confirm_frame_count: 3               # 确认新目标所需连续检测帧数
    delete_frame_count: 2                # 删除丢失目标所需连续丢失帧数

    # 融合权重 (§1.5: 雷达=距离更可靠, 相机=分类更可靠)
    lidar_weight: 0.7
    camera_weight: 0.3

    # ═══════════════════════════════════════════════════════════════════════
    # 追踪特例 (v1.6 增补)
    # ═══════════════════════════════════════════════════════════════════════
    tracking:
      keep_on_spot_frames: 300           # 建筑位顶部目标强制保持帧数 (天空方块可能被翻转改归属)
      push_detect_window_ms: 1000        # 推移检测滑动窗口 (贴地滑动/垂直轨迹异常辅助判定)

    shared_zone:
      dwell_limit_ms: 5000               # 共享区停留违规阈值 (规则 6.6)

    # ═══════════════════════════════════════════════════════════════════════
    # 在线外参校验 (v1.2 增补 — extrinsic_monitor, 模块 28)
    #   ⚠️ 2026-09-19 **降级为调试工具**: enabled 默认改 false (原 true)。理由三条:
    #   ① 检测到外参漂移后**没有可执行的动作** —— 180s 比赛内无法重标定, 唯一能做的
    #      就是"降级那路相机", 而这是个人看一眼就知道、可手动触发的决定, 不必自动检测;
    #   ② CPU 受限 (6 核全分完), 常开的周期性校验是净负担;
    #   ③ 融合层本来就在算**雷达-视觉一致性**, 拿它做异常告警是白送的, 不需要单独模块。
    #   → 现场排查 / 标定后自检时手动打开即可。仍 ⛔ 在"需真实相机标定"上, 但**不占主线排期**。
    #   ⚠ 原注释写"模块 22"有误 —— 22 是 protocol_encoder, 本模块是 28。
    # ═══════════════════════════════════════════════════════════════════════
    extrinsic_monitor:
      enabled: false
      interval_sec: 30                   # 校验周期 (s) — 场地固定特征 (柱/建筑位绿格) PnP 校验

    # ═══════════════════════════════════════════════════════════════════════
    # 推理降级 (热管理接口)
    # ═══════════════════════════════════════════════════════════════════════
    inference:
      resolution_fallback: [480, 288]    # 目标>10 或推理>30ms 时自动降级

    # ═══════════════════════════════════════════════════════════════════════
    # 静态 TF 外参 (base_link ← 各传感器) — 本处新增, 需实测标定后回填
    # ⚠ 当前为占位值; bringup 用 static_transform_publisher 广播
    # ═══════════════════════════════════════════════════════════════════════
    static_tf:
      livox_frame:
        translation: [0.0, 0.0, 0.25]    # ⚠ 占位: 雷达相对 base_link 的安装位置 (m)
        rotation_rpy: [0.0, 0.0, 0.0]    # ⚠ 占位: roll/pitch/yaw (rad)
      camera_wide_frame:
        # ⚠ 占位。⚠️ 2026-09-23 更正: 原文写"与 camera_params.yaml extrinsics 一致"——
        #    内外参已于 **2026-09-21 拆到 `config/camera_hardware.yaml`**, 那个文件里没有。
        translation: [0.15, 0.0, 0.35]
        rotation_rpy: [0.0, 0.0, 0.0]
      camera_tele_frame:
        # ⚠️ 2026-09-23 语义修正: 原为 `[-0.15, …] + rpy[0,0,3.14159]`(装在车尾、朝后),
        #    那是"前/后双相机"的遗留; 实机是**一宽一长焦、两路都朝前**(任务书 §0)。
        #    平移仍是占位(真实间距未标定), 与 wide 共用挂点。
        translation: [0.15, 0.0, 0.35]
        rotation_rpy: [0.0, 0.0, 0.0]

# ═══════════════════════════════════════════════════════════════════════════════
# mustika_pillar_check — 最小融合「穆斯蒂卡在柱上吗」(任务书 §15.5, 模块 20 第一刀)
#
# ⚠️ 与上面的 `/**` 块**是两个作用域**：`/**` 对所有节点生效，
#    本块只对**节点名 = `mustika_pillar_check`** 的那个节点生效
#    （仓库体例同 `comm_node:` / `perception_pipeline:`）。
#
# ⚠️⚠️ **`extrinsics_calibrated` 是个人工闸，默认 false**：
#    为 false 时本节点**只发残差诊断、状态恒发 0=未知**。
#    理由：内参(focal_px 等)与 TF 里的外参**目前都是占位值** ——
#    用占位外参算出的"位置一致"是**巧合**，而本节点最危险的地方就是
#    **它可能碰巧对、然后被当成标定过了**。
#    ⇒ 标定完成后**显式改成 true** —— 让"开始信任它"是一个明确动作。
# ═══════════════════════════════════════════════════════════════════════════════
mustika_pillar_check:
  ros__parameters:
    # ── 输入 ──
    wide_topic:  "/perception/camera/mustika_wide"
    tele_topic:  "/perception/camera/mustika_tele"
    lidar_topic: "/perception/lidar/result"

    # ── 输出 ──
    state_topic: "/perception/fusion/mustika_state"   # ⚠️ perception_pipeline 订阅它
    diag_topic:  "/perception/fusion/mustika_check"

    # ── ⚠️⚠️ 人工闸：外参是否已标定（见上方大段说明）──
    #
    # ⚠️⚠️ **别改这一行来翻闸**（2026-09-23 补的说明）。要翻，用 launch 参数：
    #
    #       ros2 launch br_perception bringup_full.launch.py mustika_gate:=true
    #
    #    理由：本行是**仓库事实源**，直接改它 = 事后分不清"这是临时翻的"还是
    #    "真标定过了" —— 而这道闸的设计意图恰恰是**让开始信任它是一个明确动作**。
    #    launch 参数那条路每次翻闸都在**启动命令里看得见**，且不改任何文件。
    #    （也不要用 `ros2 run ... -p`：那条路上"文件与 -p 谁压谁"**本仓库有两条
    #      互相矛盾的实测**，未定因，别赌 —— 见 doc/模块进度.md §七。）
    #    ⚠️ 本行**仍然是那两条路的事实源**：launch 参数不传时就是它说了算。
    extrinsics_calibrated: false

    # ── 坐标系（⚠️ 必须与上面 `static_tf:` 块里的 frame 名逐字一致）──
    world_frame: "world"
    camera_frames: ["camera_wide_frame", "camera_tele_frame"]

    # ── 内参（⚠️ 占位值；事实源在 config/camera_hardware.yaml，标定脚本读写那边）──
    #    ⚠️ 长度必须 = 2（宽/长焦）。长度不符会让整组被忽略并回落默认。
    #    ⚠️ 这是一笔**已知债**：内参有两处（这里 + camera_hardware.yaml），
    #       标定后要人工改两处。正解见 doc/模块进度.md（标定脚本多写一份 params 文件）。
    focal_px: [800.0, 2380.0]     # ⚠️ 占位
    cx_px:    [640.0, 640.0]      # ⚠️ 占位
    cy_px:    [360.0, 360.0]      # ⚠️ 占位

    # ── 球 ──
    #    ⚠️ 直径口径**未拍板**：ABU v1.1 原文是排球(Mikasa V300W Ø≈210)，
    #       而国内赛规则 V1 写的是 4 号室内五人制足球(Ø约200, 色号 218-165-32)。
    ball_diameter_m: 0.21
    # ⚠️ 球**坐在**柱顶 Ø180 凹槽口上时，球心比柱顶高多少 [m]
    #    **事实源是 config/field_geometry.yaml 的
    #    objects.mustika.seated_on_receptacle.center_above_pillar_top（现 = 0.054）** ——
    #    改那边时把这个一起改（球径一改，这个值就跟着变）
    ball_center_above_pillar_top_m: 0.054

    # ── 判据 ──
    pos_tolerance_m:     0.35     # 通过门槛：水平残差超它就不算"对上"
    height_tolerance_m:  0.15     # 高度门槛
    residual_max_m:      0.50     # ⚠️ "**明确反对**"门槛，**必须 ≥ pos_tolerance_m**
                                  #    （反了会出现"既通过又反对"的重叠区间）
                                  #    也是翻 `extrinsics_calibrated` 那道闸的**数字依据**：
                                  #    标定时盯诊断里的 residual，收到 < 阈值再翻
    min_confidence:      0.5      # 检测置信度下限
    min_radius_px:       8.0      # 单目测距的绝对下限（另有一条由容差推出的下限，取二者较大）
    radius_noise_px:     1.0      # 像素半径测量噪声，供推导用
    cross_check_rel:     0.3      # 两路距离差超 30% → 降级为未知（相机之间都打架）
    stale_sec:           1.0      # 相机/雷达数据超过它就当"没有"
    # ⚠️ TF 查询超时 [s] —— **别给 0**（tf2 的默认值）。TF 由 coordinate_transformer
    #    按里程计时间戳广播，本节点按消息时间戳查，两边跨进程；给 0 时缓冲区还没包住
    #    该时刻就直接抛 ExtrapolationException → 判未知，而症状写成"雷达柱位不可得"，
    #    会把现场引去查雷达。
    #    ⚠️ 与 `/**` 块里 `coordinate_transformer` 的 `tf_timeout_sec` **同值同义**，改一处要改两处。
    tf_timeout_sec:      0.05

    # ── "掉落"判据（⚠️ 两条**同时**满足才算，见 .cpp 里的说明）──
    #    只满足"远离"可能是球被 TR/BR 拿走了 —— 那种本节点看不到，只能判未知。
    fallen_dist_m:       0.8
    fallen_height_max_m: 0.4

    publish_rate_hz:     2.0
